version: '3.8'

services:
  delector:
    build: .
    container_name: delector-app
    ports:
      - "8000:8000"
    # 挂**目录**而非单文件：启用 WAL 后会生成 delector.db-wal/-shm 旁文件，
    # 单文件挂载会把它们留在容器层（docker compose down 后丢尾写）。数据统一落在 ./data。
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - DELECTOR_DATA_DIR=/app/data
