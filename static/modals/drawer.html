    <!-- ── Sticky Note Slide-over Drawer ──────────────────────── -->
    <aside id="drawer">
      <div id="drawer-resize-handle" class="drawer-resize-handle" title="按住左边缘拖拽调节抽屉宽度，双击快速切换预设宽度"></div>
      <div id="drawer-mobile-handle" class="drawer-mobile-handle" title="按住拖拽调节抽屉高度，双击快速切换全屏/半屏/精简">
        <div class="drawer-mobile-pill"></div>
      </div>
      <div class="tape-top"></div>
      <div class="drawer-header">
        <div class="drawer-tabs">
          <button
            id="d-tab-vocab"
            class="drawer-tab-btn active"
            onclick="switchDrawerTab('vocab')"
            title="词汇考点"
          >
            📖 词汇
          </button>
          <button
            id="d-tab-syntax"
            class="drawer-tab-btn"
            onclick="switchDrawerTab('syntax')"
            title="句法拓扑"
          >
            🌳 句法
          </button>
          <button
            id="d-tab-note"
            class="drawer-tab-btn"
            onclick="switchDrawerTab('note')"
            title="随笔便签"
          >
            📝 便签
          </button>
          <button
            id="d-tab-companion"
            class="drawer-tab-btn"
            onclick="switchDrawerTab('companion')"
            title="伴学导读"
          >
            🦉 伴学
          </button>
          <button
            id="d-tab-all"
            class="drawer-tab-btn"
            onclick="switchDrawerTab('all')"
            title="全部内容"
          >
            ✦ 全部
          </button>
        </div>
        <div class="drawer-actions">
          <button
            id="drawer-size-btn"
            class="drawer-size-btn"
            onclick="window.cycleDrawerMobileSize?.()"
            title="调节抽屉高度 (半屏 / 全屏 / 精简)"
          >
            ⤢
          </button>
          <button
            class="drawer-close"
            onclick="closeDrawer()"
            title="关闭工作台 (Esc)"
          >
            ✕
          </button>
        </div>
      </div>

      <div class="drawer-body">
        <!-- Section 1: Vocab & Grammar Wrap -->
        <div
          id="drawer-vocab-wrap"
          style="display: flex; flex-direction: column; gap: 1.25rem"
        >
          <!-- Word Card -->
          <div class="sticky-word-card">
            <div class="sticky-word-headline">
              <div style="display: flex; align-items: center; gap: 0.5rem">
                <span id="d-word"></span>
                <button
                  class="speaker-btn"
                  onclick="
                    playGermanAudio(
                      document.getElementById('d-word').textContent,
                    )
                  "
                  title="朗读单词"
                >
                  🔊
                </button>
              </div>
              <span class="cefr-badge" id="d-cefr"></span>
            </div>
            <div id="d-meta"></div>
            <div style="margin-top: 0.875rem">
              <div
                style="
                  display: flex;
                  justify-content: space-between;
                  align-items: center;
                "
              >
                <label class="input-label" style="margin: 0"
                  >中文释义 / 笔记 (选填)</label
                >
                <span
                  id="d-def-status"
                  style="
                    font-size: 0.6875rem;
                    color: var(--pencil);
                    font-family: var(--mono);
                  "
                ></span>
              </div>
              <input
                id="d-def"
                type="text"
                class="def-input"
                style="margin-top: 0.35rem"
                placeholder="中文释义 / 自定义笔记（自动查词或手动填写）"
              />
            </div>
            <button
              id="save-vocab-btn"
              class="btn btn-dark btn-full"
              style="margin-top: 0.75rem"
              onclick="saveVocab()"
            >
              + 加入 Anki 词汇卡
            </button>
          </div>

          <!-- Grammar Note Section -->
          <div class="grammar-note">
            <div class="grammar-note-head">
              <span class="grammar-note-title">歌德考点深度剖析</span>
              <button
                id="analyze-btn"
                class="btn btn-accent"
                style="min-height: 30px; padding: 0 0.75rem; font-size: 0.75rem"
                onclick="analyzeGrammar()"
              >
                AI 深度剖析
              </button>
            </div>
            <div
              id="grammar-result"
              class="hidden"
              style="display: flex; flex-direction: column; gap: 0.75rem"
            >
              <div
                style="
                  display: flex;
                  align-items: baseline;
                  justify-content: space-between;
                "
              >
                <span id="g-name"></span>
                <span class="cefr-badge" id="g-badge"></span>
              </div>
              <div id="g-formula" class="hidden"></div>
              <div id="g-exp"></div>
              <button
                id="save-grammar-btn"
                class="btn btn-ghost btn-full"
                onclick="saveGrammar()"
              >
                + 加入 Anki 语法卡
              </button>
            </div>
          </div>

          <!-- Context Quote -->
          <div class="context-box">
            <div
              style="
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 0.35rem;
              "
            >
              <span class="input-label" style="margin: 0">原句上下文</span>
              <button
                class="speaker-btn-sm"
                onclick="
                  playGermanAudio(document.getElementById('d-sent').textContent)
                "
                title="朗读整句"
              >
                🔊 朗读原句
              </button>
            </div>
            <div id="d-sent"></div>
          </div>
        </div>

        <!-- Section 2: Satzbau & Clause Tree Section -->
        <div id="drawer-syntax-section" class="drawer-syntax-card hidden">
          <div class="sticky-word-headline">
            <div style="display: flex; align-items: center; gap: 0.5rem">
              <span
                style="font-size: 0.875rem; font-weight: 700; color: var(--ink)"
                >🌳 句法拓扑与从句树 (AST)</span
              >
            </div>
            <span id="syntax-sent-type-badge" class="cefr-badge badge-B1"
              >V2 主句</span
            >
          </div>

          <!-- Sentence preview -->
          <div
            id="syntax-sent-quote"
            class="quote-text"
            style="
              margin-top: 0.5rem;
              font-size: 0.8125rem;
              color: var(--ink);
              background: var(--paper-accent);
              padding: 0.5rem 0.75rem;
              border-radius: 6px;
              line-height: 1.5;
            "
          ></div>

          <!-- Felder Modell Grid -->
          <div style="margin-top: 1rem">
            <div
              style="
                font-size: 0.75rem;
                font-weight: 700;
                color: var(--pencil);
                text-transform: uppercase;
                letter-spacing: 0.05em;
                margin-bottom: 0.35rem;
              "
            >
              德语拓扑五场域 (Felder-Modell)
            </div>
            <div id="syntax-felder-grid" class="felder-grid">
              <!-- Dynamic fields -->
            </div>
          </div>

          <!-- Interactive Clause Tree Hierarchy -->
          <div style="margin-top: 1.25rem">
            <div
              style="
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 0.5rem;
              "
            >
              <div
                style="
                  font-size: 0.75rem;
                  font-weight: 700;
                  color: var(--pencil);
                  text-transform: uppercase;
                  letter-spacing: 0.05em;
                "
              >
                主从句分层拓扑树
              </div>
              <span
                style="
                  font-size: 0.6875rem;
                  color: var(--pencil);
                  font-family: var(--mono);
                "
                >点击节点可高亮</span
              >
            </div>
            <div id="syntax-tree-container" class="syntax-tree-container">
              <!-- Dynamic Clause Tree Nodes -->
            </div>
          </div>

          <!-- Section 2.3: Corpus Grammar Radar (Grammatik-Radar) -->
          <details id="grammar-radar-panel" class="grammar-radar-panel" style="margin-top: 1.25rem; border: 1px solid var(--rule-light); border-radius: 8px; padding: 0.5rem 0.75rem; background: var(--paper-warm);">
            <summary style="font-size: 0.75rem; font-weight: 700; color: var(--pencil); text-transform: uppercase; letter-spacing: 0.05em; cursor: pointer; user-select: none;">
              📡 语料句法复杂度雷达 (Grammatik-Radar)
            </summary>
            <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; margin-top: 0.75rem;">
              <svg id="grammar-radar-svg" width="220" height="220" viewBox="0 0 220 220" style="overflow: visible;"></svg>
              <div id="grammar-radar-stats" class="radar-legend" style="width: 100%; margin-top: 0.5rem; font-size: 0.75rem; color: var(--pencil);"></div>
            </div>
          </details>
        </div>

        <!-- Section 3: Sticky Reading Notes Section -->
        <div id="drawer-note-section" class="sticky-reading-note-card hidden">
          <div class="sticky-word-headline">
            <span
              style="font-size: 0.875rem; font-weight: 700; color: var(--ink)"
              >📝 精读随笔便签</span
            >
            <span id="note-badge-status" class="cefr-badge badge-A2"
              >便签草稿</span
            >
          </div>
          <div
            id="note-quote"
            class="quote-text"
            style="
              margin-top: 0.5rem;
              font-style: italic;
              font-size: 0.8125rem;
              color: var(--pencil);
            "
          ></div>
          <div style="margin-top: 0.75rem">
            <div
              style="
                display: flex;
                justify-content: space-between;
                align-items: center;
              "
            >
              <label class="input-label" style="margin: 0"
                >随笔心得 / 搭配拆解</label
              >
              <button
                id="note-ai-btn"
                class="btn btn-accent"
                style="
                  min-height: 24px;
                  padding: 0 0.5rem;
                  font-size: 0.6875rem;
                "
                onclick="aiNoteAssist()"
              >
                ✨ AI 速记辅助
              </button>
            </div>
            <textarea
              id="note-text-input"
              class="note-textarea"
              rows="3"
              placeholder="记录句式搭配、长难句拆解或个人心得…"
            ></textarea>
          </div>
          <div style="display: flex; gap: 0.5rem; margin-top: 0.75rem">
            <button
              id="save-note-btn"
              class="btn btn-dark"
              style="flex: 1"
              onclick="saveCurrentNote()"
            >
              ✓ 保存便签
            </button>
            <button
              id="del-note-btn"
              class="btn btn-ghost btn-del hidden"
              onclick="deleteCurrentNote()"
              title="删除便签"
            >
              🗑️
            </button>
          </div>
        </div>

        <!-- Section 4: Companion Agent Section (伴学导学) -->
        <div id="drawer-companion-section" class="drawer-companion-section hidden">
          <div class="companion-session-bar" id="companion-session-bar">
            <select id="companion-session-select" class="companion-session-select" onchange="window.CompanionDrawer?.switchSession(this.value)" title="选择或切换历史会话">
              <option value="">新伴学会话</option>
            </select>
            <button type="button" class="companion-new-chat-btn" onclick="window.CompanionDrawer?.newSession()" title="新建独立对话">＋ 新对话</button>
          </div>
          <div id="companion-context-bar" class="companion-context-bar"></div>
          <div id="companion-drawer-body" class="companion-chat-stream">
            <div class="companion-message assistant">
              <div class="companion-text-body">Hallo! 我是你的研读伙伴 Eule。选中德语难句点击我，我可以为你深入剖析拓扑结构、语用褒贬或批量制作闪卡。</div>
            </div>
          </div>
          <div class="companion-drawer-footer">
            <div class="companion-thinking-toolbar" id="companion-thinking-toolbar">
              <span class="companion-thinking-label">思考强度:</span>
              <div class="companion-thinking-pills">
                <button type="button" class="thinking-pill" data-effort="low" onclick="window.CompanionDrawer?.setReasoningEffort('low')">⚡ 极速</button>
                <button type="button" class="thinking-pill active" data-effort="medium" onclick="window.CompanionDrawer?.setReasoningEffort('medium')">⚖ 平衡</button>
                <button type="button" class="thinking-pill" data-effort="high" onclick="window.CompanionDrawer?.setReasoningEffort('high')">🧠 深度</button>
              </div>
            </div>
            <div id="companion-quick-actions" class="companion-quick-actions">
              <button class="companion-quick-chip chip-utility" onclick="window.CompanionDrawer?.syncContext()">🎯 抓取当前句</button>
              <button class="companion-quick-chip context-required" onclick="window.CompanionDrawer?.sendPrompt('请帮我分析选中文本的主从句拓扑结构与核心动词位置。')">从句拓扑问诊</button>
              <button class="companion-quick-chip context-required" onclick="window.CompanionDrawer?.sendPrompt('请帮我提取选中文本中的核心 B1/B2 动词与动介搭配，并提议制成生词卡。')">提取核心生词</button>
              <button class="companion-quick-chip context-required" onclick="window.CompanionDrawer?.sendPrompt('这个句子在德语母语者的语用习惯中具有怎样的情感色彩与正式度？')">深挖语用褒贬</button>
            </div>
            <div class="companion-input-row">
              <input
                id="companion-input"
                type="text"
                class="companion-input"
                placeholder="输入德语学习疑问或指令..."
                onkeydown="if(event.key==='Enter')window.CompanionDrawer?.handleSend()"
              />
              <button id="companion-send-btn" class="companion-send-btn" onclick="window.CompanionDrawer?.handleSend()">
                发送
              </button>
            </div>
          </div>
        </div>
      </div>
    </aside>
