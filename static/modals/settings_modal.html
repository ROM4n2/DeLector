    <!-- ── Settings Modal ───────────────────────────────────────── -->
    <div
      id="settings-overlay"
      class="modal-overlay hidden"
      onclick="if (event.target === this) closeSettingsModal();"
    >
      <div
        class="modal settings-modal-box"
        role="dialog"
        aria-modal="true"
        aria-labelledby="settings-title"
      >
        <div class="modal-header settings-modal-header">
          <span id="settings-title" class="settings-modal-title"
            >偏好与 API 设置 (Einstellungen)</span
          >
          <button
            class="drawer-close"
            onclick="closeSettingsModal()"
            title="关闭 (Esc)"
            aria-label="关闭设置"
          >
            <svg class="ui-ico" aria-hidden="true" focusable="false"><use href="#ui-ico-x"></use></svg>
          </button>
        </div>

        <section class="settings-group">
          <button
            type="button"
            class="settings-group-toggle"
            aria-expanded="true"
            aria-controls="settings-group-ai"
            onclick="toggleSettingsGroup(this)"
          >
            <span class="settings-group-heading">
              <span class="settings-group-title">AI 深度剖析与模型</span>
              <span class="settings-group-value" id="set-reasoning-summary">思考：标准</span>
            </span>
            <svg class="ui-ico settings-group-chevron" aria-hidden="true" focusable="false">
              <use href="#ui-ico-chevron-down"></use>
            </svg>
          </button>
          <div class="settings-group-body" id="settings-group-ai">
            <p class="settings-tip">
              用于选词语法深度剖析与随笔便签速记。词库、形态学、五场域拓扑、完形
              C-Test 等功能 100% 离线，无需 API Key。
            </p>

            <div class="modal-field">
              <label class="input-label" for="set-api-key">API 密钥 (API Key)</label>
              <div class="settings-inline-row">
                <input
                  id="set-api-key"
                  type="password"
                  class="modal-input"
                  placeholder="sk-..."
                  autocomplete="off"
                />
                <button
                  id="btn-toggle-key-vis"
                  class="btn btn-ghost settings-key-vis-btn"
                  onclick="toggleKeyVisibility()"
                  title="显示/隐藏 API 密钥"
                  aria-label="显示 API 密钥"
                >
                  显示
                </button>
              </div>
              <span id="set-key-status" class="settings-field-status"></span>
            </div>

            <div class="settings-grid-2">
              <div class="modal-field">
                <label class="input-label" for="set-base-url">接口地址 (Base URL)</label>
                <input
                  id="set-base-url"
                  type="text"
                  class="modal-input"
                  placeholder="https://api.deepseek.com"
                />
                <div class="settings-preset-row">
                  <button
                    type="button"
                    class="btn-preset-pill"
                    onclick="
                      document.getElementById('set-base-url').value =
                        'https://api.deepseek.com'
                    "
                  >
                    DeepSeek 官方
                  </button>
                  <button
                    type="button"
                    class="btn-preset-pill"
                    onclick="
                      document.getElementById('set-base-url').value =
                        'https://api.openai.com/v1'
                    "
                  >
                    OpenAI
                  </button>
                </div>
              </div>
              <div class="modal-field">
                <label class="input-label" for="set-model-name">模型名称 (Model)</label>
                <input
                  id="set-model-name"
                  type="text"
                  class="modal-input"
                  placeholder="deepseek-flash"
                />
                <div class="settings-preset-row">
                  <button
                    type="button"
                    class="btn-preset-pill"
                    onclick="
                      document.getElementById('set-model-name').value =
                        'deepseek-flash'
                    "
                  >
                    DeepSeek-Flash
                  </button>
                </div>
              </div>
            </div>
            <div id="set-effective-model" class="settings-effective-model">
              当前生效：—
            </div>

            <div class="modal-field">
              <span class="input-label" id="set-reasoning-effort-label">思考强度 (Reasoning Effort)</span>
              <div
                id="set-reasoning-effort"
                class="settings-reasoning"
                role="radiogroup"
                aria-labelledby="set-reasoning-effort-label"
              >
                <button
                  type="button"
                  class="settings-reasoning-btn"
                  role="radio"
                  aria-checked="false"
                  data-effort="none"
                  tabindex="-1"
                  onclick="selectReasoningEffort('none')"
                >
                  关闭
                </button>
                <button
                  type="button"
                  class="settings-reasoning-btn"
                  role="radio"
                  aria-checked="true"
                  data-effort="medium"
                  tabindex="0"
                  onclick="selectReasoningEffort('medium')"
                >
                  标准
                </button>
                <button
                  type="button"
                  class="settings-reasoning-btn"
                  role="radio"
                  aria-checked="false"
                  data-effort="high"
                  tabindex="-1"
                  onclick="selectReasoningEffort('high')"
                >
                  深读
                </button>
              </div>
              <div class="settings-reasoning-hint" id="set-reasoning-hint">
                标准：常规语法场域分析
              </div>
              <div class="settings-reasoning-status" id="set-reasoning-status" role="status" aria-live="polite"></div>
              <div class="hint-text">
                调节 DeepSeek 与思维链模型的深度推演强度；点选后立即保存并生效。
              </div>
            </div>

            <div class="settings-actions-row">
              <button
                id="btn-test-key"
                class="btn btn-ghost"
                onclick="testApiKeyConnection()"
              >
                测试连通性
              </button>
              <span id="test-key-feedback" class="settings-test-feedback"></span>
            </div>
          </div>
        </section>

        <section class="settings-group">
          <button
            type="button"
            class="settings-group-toggle"
            aria-expanded="true"
            aria-controls="settings-group-tts"
            onclick="toggleSettingsGroup(this)"
          >
            <span class="settings-group-title">德语发音与 TTS</span>
            <svg class="ui-ico settings-group-chevron" aria-hidden="true" focusable="false">
              <use href="#ui-ico-chevron-down"></use>
            </svg>
          </button>
          <div class="settings-group-body" id="settings-group-tts">
            <div class="settings-grid-2">
              <div class="modal-field">
                <label class="input-label" for="set-tts-voice">默认发音人 (Voice)</label>
                <select id="set-tts-voice" class="modal-input">
                  <option value="de-DE-KatjaNeural">
                    Katja (女声 · 德国之声推荐)
                  </option>
                  <option value="de-DE-ConradNeural">
                    Conrad (男声 · 严谨沉稳)
                  </option>
                  <option value="de-DE-AmalaNeural">
                    Amala (女声 · 自然清晰)
                  </option>
                  <option value="de-DE-KillianNeural">
                    Killian (男声 · 浑厚母语)
                  </option>
                </select>
              </div>
              <div class="modal-field">
                <label class="input-label" for="set-tts-rate">朗读语速 (Speed)</label>
                <select id="set-tts-rate" class="modal-input">
                  <option value="-15%">0.85x 放缓 (影子跟读推荐)</option>
                  <option value="+0%" selected>1.0x 标准语速</option>
                  <option value="+15%">1.15x 挑战语速</option>
                </select>
              </div>
            </div>
          </div>
        </section>

        <div class="settings-footer">
          <button class="btn btn-ghost" onclick="closeSettingsModal()">
            取消
          </button>
          <button
            id="btn-save-settings"
            class="btn btn-dark"
            onclick="saveAppSettings()"
          >
            保存并生效
          </button>
        </div>
      </div>
    </div>
