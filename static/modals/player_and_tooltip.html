    <!-- ── Floating Shadow Reading Player (Root Level) ─────────── -->
    <div id="shadow-player" class="shadow-player hidden">
      <div class="player-left">
        <button
          id="player-prev-btn"
          class="player-btn"
          onclick="ShadowPlayer.prev()"
          title="上一句 (←)"
          aria-label="上一句"
        >
          <svg class="ui-ico" aria-hidden="true" focusable="false"><use href="#ui-ico-skip-back"></use></svg>
        </button>
        <button
          id="player-play-btn"
          class="player-btn player-btn-main"
          onclick="ShadowPlayer.toggle()"
          title="播放/暂停 (Space)"
          aria-label="播放"
        >
          <svg class="ui-ico" aria-hidden="true" focusable="false"><use href="#ui-ico-play"></use></svg>
        </button>
        <button
          id="player-next-btn"
          class="player-btn"
          onclick="ShadowPlayer.next()"
          title="下一句 (→)"
          aria-label="下一句"
        >
          <svg class="ui-ico" aria-hidden="true" focusable="false"><use href="#ui-ico-skip-forward"></use></svg>
        </button>
        <button
          id="player-replay-btn"
          class="player-btn"
          onclick="ShadowPlayer.replay()"
          title="重播当前句 (R)"
          aria-label="重播当前句"
        >
          <svg class="ui-ico" aria-hidden="true" focusable="false"><use href="#ui-ico-rotate-ccw"></use></svg>
        </button>
      </div>

      <!-- 可见状态行：句序 / 跟读倒计时 / TTS 引擎与音色降级提示。
           曾以 0×0 隐藏，承载的信息（尤其「语音引擎不可用」）用户完全看不到。 -->
      <div id="player-status" class="player-status" role="status" aria-live="polite">
        <span id="player-status-text">句 1 / -</span>
        <span id="player-voice-note" class="player-voice-note hidden"
          >当前音色不可用，使用系统语音</span
        >
      </div>

      <div class="player-right">
        <div class="player-topline">
          <!-- Voice selector：折叠态回显当前音色，点开列全部 4 个 -->
          <div class="voice-pill">
            <button
              id="voice-current-btn"
              class="voice-current-btn"
              type="button"
              onclick="ShadowPlayer.toggleVoiceMenu()"
              title="选择朗读音色"
              aria-haspopup="true"
              aria-expanded="false"
              aria-controls="voice-menu"
            >
              <span id="voice-current-label" class="voice-current-label">女声 · Katja</span>
              <span class="voice-caret" aria-hidden="true">▾</span>
            </button>
            <div id="voice-menu" class="voice-menu hidden" role="radiogroup" aria-label="朗读音色">
              <button
                type="button"
                class="voice-option active"
                role="radio"
                aria-checked="true"
                data-voice="de-DE-KatjaNeural"
                onclick="ShadowPlayer.setVoice('de-DE-KatjaNeural')"
              >
                <span class="vo-name">Katja</span>
                <span class="vo-meta">女声 · 德国之声推荐</span>
                <span class="vo-check" aria-hidden="true">当前</span>
              </button>
              <button
                type="button"
                class="voice-option"
                role="radio"
                aria-checked="false"
                data-voice="de-DE-ConradNeural"
                onclick="ShadowPlayer.setVoice('de-DE-ConradNeural')"
              >
                <span class="vo-name">Conrad</span>
                <span class="vo-meta">男声 · 严谨沉稳</span>
                <span class="vo-check" aria-hidden="true">当前</span>
              </button>
              <button
                type="button"
                class="voice-option"
                role="radio"
                aria-checked="false"
                data-voice="de-DE-AmalaNeural"
                onclick="ShadowPlayer.setVoice('de-DE-AmalaNeural')"
              >
                <span class="vo-name">Amala</span>
                <span class="vo-meta">女声 · 自然清晰</span>
                <span class="vo-check" aria-hidden="true">当前</span>
              </button>
              <button
                type="button"
                class="voice-option"
                role="radio"
                aria-checked="false"
                data-voice="de-DE-KillianNeural"
                onclick="ShadowPlayer.setVoice('de-DE-KillianNeural')"
              >
                <span class="vo-name">Killian</span>
                <span class="vo-meta">男声 · 浑厚母语</span>
                <span class="vo-check" aria-hidden="true">当前</span>
              </button>
            </div>
          </div>

          <div class="player-mode-group">
            <button
              class="mode-btn active"
              data-mode="shadow"
              onclick="ShadowPlayer.setMode('shadow')"
              title="智能影子跟读（每句停顿等候跟读）"
            >
              跟读
            </button>
            <button
              class="mode-btn"
              data-mode="continuous"
              onclick="ShadowPlayer.setMode('continuous')"
              title="全文连续朗读"
            >
              连读
            </button>
            <button
              class="mode-btn"
              data-mode="loop"
              onclick="ShadowPlayer.setMode('loop')"
              title="单句循环练习"
            >
              单句
            </button>
          </div>
        </div>

        <div class="speed-pill">
          <button
            class="speed-step-btn"
            data-speed="0.6"
            onclick="ShadowPlayer.setSpeed(0.6)"
          >
            0.6x
          </button>
          <button
            class="speed-step-btn active"
            data-speed="0.8"
            onclick="ShadowPlayer.setSpeed(0.8)"
          >
            0.8x
          </button>
          <button
            class="speed-step-btn"
            data-speed="1.0"
            onclick="ShadowPlayer.setSpeed(1.0)"
          >
            1.0x
          </button>
          <button
            class="speed-step-btn"
            data-speed="1.2"
            onclick="ShadowPlayer.setSpeed(1.2)"
          >
            1.2x
          </button>
        </div>
      </div>
    </div>

    <!-- ── Floating Selection Tooltip (Root Level) ──────────────── -->
    <div id="selection-tooltip" class="selection-tooltip hidden">
      <div class="tooltip-colors">
        <button
          class="hl-color-btn hl-yellow"
          onclick="applyHighlight('yellow')"
          title="黄色荧光笔"
        ></button>
        <button
          class="hl-color-btn hl-green"
          onclick="applyHighlight('green')"
          title="绿色重点笔"
        ></button>
        <button
          class="hl-color-btn hl-pink"
          onclick="applyHighlight('pink')"
          title="粉色难点笔"
        ></button>
      </div>
      <span class="tooltip-sep"></span>
      <button
        class="tooltip-action-btn"
        onclick="openSyntaxDrawerFromSelection()"
        title="展开德语拓扑五场域与从句树"
      >
        句法
      </button>
      <button
        class="tooltip-action-btn"
        onclick="askCompanionFromSelection()"
        title="向伴学助手 Eule 咨询此难句"
      >
        问伴学
      </button>
      <button
        class="tooltip-action-btn"
        onclick="openNoteDrawerFromSelection()"
        title="记录随笔便签"
      >
        随笔
      </button>
      <button
        class="tooltip-action-btn"
        onclick="playSelectedAudio()"
        title="真人朗读发音"
      >
        朗读
      </button>
    </div>
