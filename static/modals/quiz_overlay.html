    <!-- ── Quiz Overlay ─────────────────────────────────────────── -->
    <div id="quiz-overlay" class="quiz-overlay hidden">
      <!-- Step 1: Mode Selector -->
      <div id="quiz-step-mode" class="quiz-panel">
        <div class="quiz-panel-head">
          <h3>选择考验模式</h3>
          <button class="quiz-close-btn" onclick="closeQuizOverlay()">✕</button>
        </div>
        <div class="quiz-mode-grid">
          <button class="quiz-mode-card" onclick="startQuiz('flashcard')">
            <div class="quiz-mode-icon">🎴</div>
            <div class="quiz-mode-title">闪卡自测</div>
            <div class="quiz-mode-desc">正面看词，翻面对答案</div>
          </button>
          <button class="quiz-mode-card" onclick="startQuiz('dictation')">
            <div class="quiz-mode-icon">✍️</div>
            <div class="quiz-mode-title">默写拼写</div>
            <div class="quiz-mode-desc">看中文义，手写德语词</div>
          </button>
          <button class="quiz-mode-card" onclick="startQuiz('choice')">
            <div class="quiz-mode-icon">🎯</div>
            <div class="quiz-mode-title">四选一</div>
            <div class="quiz-mode-desc">从四个选项中选正确释义</div>
          </button>
        </div>
        <p class="quiz-meta-note">仅测验词汇卡，错误率高的卡片优先出现</p>
      </div>

      <!-- Step 2: Quiz Runner -->
      <div id="quiz-step-run" class="quiz-panel hidden">
        <div class="quiz-runner-head">
          <button class="quiz-close-btn" onclick="closeQuizOverlay()">✕</button>
          <div class="quiz-progress-bar-wrap">
            <div
              id="quiz-progress-fill"
              class="quiz-progress-fill"
              style="width: 0%"
            ></div>
          </div>
          <div class="quiz-score-label">
            <span id="quiz-score-correct">0</span> 正 /
            <span id="quiz-score-wrong">0</span> 误 ·
            <span id="quiz-pos">1</span>/<span id="quiz-total">0</span>
          </div>
        </div>

        <!-- Flashcard mode -->
        <div id="quiz-flashcard-wrap" class="quiz-card-wrap hidden">
          <div
            id="quiz-flashcard"
            class="quiz-flashcard"
            onclick="flipFlashcard()"
          >
            <div class="quiz-card-front">
              <div id="quiz-fc-word" class="quiz-big-word"></div>
              <div id="quiz-fc-cefr" class="quiz-fc-badge"></div>
              <div class="quiz-flip-hint">点击翻面</div>
            </div>
            <div class="quiz-card-back hidden">
              <div id="quiz-fc-def" class="quiz-fc-def"></div>
              <div id="quiz-fc-sent" class="quiz-fc-sent"></div>
            </div>
          </div>
          <div id="quiz-fc-actions" class="quiz-fc-actions hidden">
            <button
              class="quiz-result-btn quiz-btn-wrong"
              onclick="submitFlashcard(false)"
            >
              ✗ 不认识
            </button>
            <button
              class="quiz-result-btn quiz-btn-correct"
              onclick="submitFlashcard(true)"
            >
              ✓ 认识了
            </button>
          </div>
        </div>

        <!-- Dictation mode -->
        <div id="quiz-dictation-wrap" class="quiz-card-wrap hidden">
          <div class="quiz-dictation-card">
            <div class="quiz-dict-prompt-label">请用德语拼写：</div>
            <div id="quiz-dict-def" class="quiz-big-def"></div>
            <div id="quiz-dict-sent-hint" class="quiz-dict-hint"></div>
            <div class="quiz-dict-input-row">
              <input
                id="quiz-dict-input"
                class="quiz-dict-input"
                type="text"
                placeholder="输入德语单词..."
                autocomplete="off"
                autocorrect="off"
                onkeydown="if (event.key === 'Enter') checkDictation();"
              />
              <button class="btn btn-dark" onclick="checkDictation()">
                确认
              </button>
            </div>
            <div
              id="quiz-dict-feedback"
              class="quiz-dict-feedback hidden"
            ></div>
            <button
              id="quiz-dict-next"
              class="btn btn-ghost btn-full hidden"
              onclick="advanceQuiz()"
            >
              下一题 →
            </button>
          </div>
        </div>

        <!-- Choice mode -->
        <div id="quiz-choice-wrap" class="quiz-card-wrap hidden">
          <div class="quiz-choice-card">
            <div class="quiz-choice-question">
              以下哪个是 "<span id="quiz-choice-word"></span>" 的释义？
            </div>
            <div
              id="quiz-choice-cefr"
              class="quiz-fc-badge"
              style="margin: 0 auto 1rem"
            ></div>
            <div id="quiz-choice-options" class="quiz-choice-options"></div>
          </div>
        </div>
      </div>

      <!-- Step 3: Completion -->
      <div id="quiz-step-done" class="quiz-panel hidden">
        <div id="quiz-confetti" class="quiz-confetti-canvas"></div>
        <div class="quiz-done-content">
          <div class="quiz-done-icon">🏆</div>
          <h3 class="quiz-done-title">考验完成！</h3>
          <div class="quiz-done-stats">
            <span id="done-correct">0</span> 正确 /
            <span id="done-wrong">0</span> 错误
          </div>
          <div id="done-accuracy" class="quiz-done-accuracy"></div>
          <div id="done-encourage" class="quiz-done-encourage"></div>
          <div class="quiz-done-actions">
            <button class="btn btn-ghost" onclick="closeQuizOverlay()">
              返回卡片库
            </button>
            <button class="btn btn-dark" onclick="openQuizOverlay()">
              再测一遍
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Milestone Toast -->
    <div id="milestone-toast" class="milestone-toast hidden"></div>

    <!-- Hosted Toast 带：读/AI/后台路径错误与轻成功消息走这里，不做阻断式 alert -->
    <div id="wb-notify" class="wb-notify" role="status" aria-live="polite"></div>
