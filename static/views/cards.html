    <!-- ── View 3: Cards & Review Library ─────────────────────── -->
    <main id="view-cards" class="view">
      <div class="cards-topbar">
        <button class="btn btn-ghost" onclick="show('home')">← 返回文库</button>
        <h2>卡片库 · KARTEIKARTEN</h2>
        <div
          style="
            display: flex;
            gap: 0.5rem;
            align-items: center;
            flex-wrap: wrap;
          "
        >
          <button
            id="quiz-start-btn"
            class="btn btn-dark"
            onclick="openQuizOverlay()"
            title="开始考验所有待复习卡片"
          >
            ⚔ 开始考验
          </button>
          <button
            id="clear-cache-btn"
            class="btn btn-ghost"
            onclick="clearAudioCache()"
            title="查看并清理本地 MP3 语音缓存"
          >
            🗑️ 缓存 (<span id="cache-size-span">0 MB</span>)
          </button>
          <button
            class="btn btn-ghost"
            onclick="downloadBackupJson()"
            title="导出全部文章、卡片（含复习进度）、笔记、学习统计与界面设置为 JSON 文件"
          >
            导出备份
          </button>
          <button
            class="btn btn-ghost"
            onclick="document.getElementById('backup-file-input').click()"
            title="⚠ 用备份文件整体替换当前数据——现有文章、卡片与统计会被清空"
          >
            还原备份
          </button>
          <input
            id="backup-file-input"
            type="file"
            accept=".json,application/json"
            style="display: none"
            onchange="uploadBackupJson(event)"
          />
          <a href="/api/cards/export/apkg" class="btn btn-dark">导出 Anki</a>
        </div>
      </div>

      <!-- Segment & Mode Switcher Row -->
      <div class="cards-control-row">
        <div class="cards-seg-bar">
          <button
            id="seg-due"
            class="cards-seg-btn active"
            onclick="setCardSegment('due')"
            title="根据 SuperMemo SM-2 算法今日到期的卡片"
          >
            今日到期 <span id="seg-due-count" class="seg-count">0</span>
          </button>
          <button
            id="seg-pending"
            class="cards-seg-btn"
            onclick="setCardSegment('pending')"
            title="所有待复习状态的卡片"
          >
            待复习全量 <span id="seg-pending-count" class="seg-count">0</span>
          </button>
          <button
            id="seg-mastered"
            class="cards-seg-btn"
            onclick="setCardSegment('mastered')"
            title="已掌握归档卡片"
          >
            已掌握 <span id="seg-mastered-count" class="seg-count">0</span>
          </button>
          <!-- 徽标初值是「–」而不是 0：矩阵懒加载，首次进入该段才拉数。
             写 0 会在没数据的时候撒谎说词库是空的。 -->
          <button
            id="seg-prep"
            class="cards-seg-btn"
            onclick="setCardSegment('prep')"
            title="按介词浏览全部固定搭配（Präpositionen-Matrix）"
          >
            Präpositionen <span id="seg-prep-count" class="seg-count">–</span>
          </button>
        </div>

        <div class="cards-view-toggle">
          <button
            id="mode-btn-deck"
            class="cards-mode-btn active"
            onclick="setCardViewMode('deck')"
            title="扑克牌叠层翻页模式"
          >
            🎴 扑克牌盒
          </button>
          <button
            id="mode-btn-grid"
            class="cards-mode-btn"
            onclick="setCardViewMode('grid')"
            title="目录全景平铺列表"
          >
            📑 全景目录
          </button>
        </div>
      </div>

      <div id="prep-filter-bar" class="prep-filter-bar hidden">
        <div class="prep-case-pills">
          <button
            class="folio-anchor-pill active"
            data-kasus=""
            onclick="filterPrepCase('')"
          >
            Alle
          </button>
          <button
            class="folio-anchor-pill"
            data-kasus="Dat"
            onclick="filterPrepCase('Dat')"
          >
            Dativ
          </button>
          <button
            class="folio-anchor-pill"
            data-kasus="Akk"
            onclick="filterPrepCase('Akk')"
          >
            Akkusativ
          </button>
          <button
            class="folio-anchor-pill"
            data-kasus="Gen"
            onclick="filterPrepCase('Gen')"
          >
            Genitiv
          </button>
        </div>
        <input
          type="text"
          class="modal-input prep-search-input"
          id="prep-search-input"
          placeholder="动词 / 形容词 suchen…"
          oninput="searchPrepCollocations(this.value)"
        />
      </div>

      <div id="cards-container"></div>
    </main>
