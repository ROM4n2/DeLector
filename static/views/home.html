    <!-- ── View 1: Home Library ───────────────────────────────── -->
    <main id="view-home" class="view active">
      <div class="home-hero">
        <div class="hero-eyebrow">
          <span class="dot"></span>
          <span>CEFR IMMERSIVE WORKSPACE · 歌德备考</span>
        </div>
        <h1>把德语长句<span class="accent-word">拆开</span>看</h1>
        <p>
          不是又一个带 CEFR 色标的阅读器。不用导入长文，下面这句现在就能拆出
          <strong>VF/LK/MF/RK/NF 五场域</strong>、主从句树和名词格位。
        </p>
        <div class="home-cta">
          <button class="btn btn-accent" onclick="openSatzLab()">
            先拆一句试试 →

          <button class="btn btn-ghost" onclick="openModal()">
            + 导入德语文章

      <section id="satz-lab" class="satz-lab" aria-labelledby="satz-lab-title">
        <div class="satz-lab-head">
          <div>
            <div class="satz-lab-eyebrow">SATZ-LABOR · 不用导入长文</div>
            <h2 id="satz-lab-title">一句话，拆开看</h2>
            <p class="satz-lab-sub">
              五场域拓扑、主从句树、名词格位——点一句示例，本地引擎当场拆给你看。
            </p>
          </div>
          <span class="satz-lab-badge">LIVE · 本地 spaCy</span>
        </div>
        <div
          id="satz-lab-samples"
          class="satz-lab-samples"
          role="group"
          aria-label="示例句"
        ></div>
        <div id="satz-lab-output" class="satz-lab-output" aria-live="polite">
          <div class="satz-lab-placeholder">正在准备示例句…</div>
        </div>
      </section>

      <!-- Highlighter Legend -->
      <div class="cefr-legend">

        <span class="encounter-entry-sub">手选分级德语短篇 · Begegnungszone</span>
      </div>
