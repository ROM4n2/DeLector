    <!-- ── View 5: Writing Desk & Polish (Schreibwerkstatt) ──────── -->
    <main id="view-writer" class="view">
      <div class="writer-container">
        <div class="writer-header-bar">
          <button
            class="btn btn-ghost"
            onclick="show('home')"
            title="返回文稿库"
          >
            ← 返回文库
          </button>
          <div>
            <div class="hero-eyebrow" style="margin-bottom: 0.25rem">
              <span class="dot"></span>
              <span>SCHREIBWERKSTATT · 德语写作研磨工坊</span>
            </div>
            <h2 class="writer-title-heading">德语写作诊断与语法润色</h2>
          </div>
          <div class="writer-actions-top">
            <button
              class="btn btn-ghost"
              onclick="clearWriterForm()"
              title="新建空白作文草稿"
            >
              ＋ 新建草稿
            </button>
            <button
              class="btn btn-ghost"
              id="writer-ai-btn"
              onclick="aiPolishEssay()"
              title="使用 DeepSeek AI 深度润色全文"
            >
              ✨ AI 润色全文
            </button>
            <!-- 取消槽位：只在流式润色进行中显示（writer.js 的 setPolishCancelVisible 切 .hidden）；
                 点击 = controller.abort() ⇒ 服务端据此取消循环任务，不再继续烧配额。 -->
            <button
              class="btn btn-ghost hidden"
              id="writer-ai-cancel-btn"
              onclick="cancelAiPolish()"
              title="中止正在进行的 AI 润色（已消耗的部分不会退回）"
            >
              ✕ 中止润色
            </button>
            <button class="btn btn-ghost" onclick="analyzeWriterText(true)">
              ⚡ 实时诊断
            </button>
            <button
              class="btn btn-ghost writer-mobile-panel-trigger"
              id="writer-mobile-panel-trigger"
              onclick="toggleWriterMobilePanel()"
            >
              📋 问题与历史
            </button>
            <button
              class="btn btn-dark"
              id="writer-save-btn"
              onclick="saveWriterEssay()"
            >
              💾 保存作文
            </button>
          </div>
        </div>

        <div class="writer-layout">
          <!-- Writer Modes Bar: Standard Essay vs Goethe A1 Schreiben Lab -->
          <div
            class="writer-mode-switcher-bar"
            style="grid-column: 1 / -1; width: 100%"
          >
            <button
              id="writer-mode-essay"
              class="writer-mode-tab active"
              onclick="switchWriterMode('essay')"
            >
              ✍️ 自由写作与研磨 (Freies Schreiben)
            </button>
          </div>

          <!-- Left Area: Inline IDE Editor & Essay History -->
          <div class="writer-left" id="writer-free-left">
            <div class="writer-card-box">
              <div class="writer-box-label" style="margin-bottom: 0.5rem">
                <span>✍️ 德语内联智能编辑器</span>
                <span id="writer-render-status" class="writer-status-pill"
                  >等待输入</span
                >
              </div>
              <input
                id="writer-title"
                class="writer-input-title"
                placeholder="作文标题（如：Mein Urlaub in Berlin / B1 备考书信）..."
                maxlength="80"
              />
              <div
                id="ide-editor"
                class="ide-editor"
                contenteditable="true"
                data-placeholder="在此粘贴或直接书写德语作文（如：Ich fahre mit der Auto.）..."
                oninput="analyzeWriterText()"
                spellcheck="false"
              ></div>

              <div class="writer-toolbar">
                <div class="writer-word-counter" id="writer-stats-counter">
                  0 词 · 0 句
                </div>
                <div class="writer-tools-right">
                  <button
                    id="writer-inlay-toggle"
                    class="btn btn-ghost btn-xs"
                    onclick="toggleInlayHints()"
                    title="开启/关闭语法内联提示"
                  >
                    💡 格提示 ON
                  </button>
                  <button
                    class="btn btn-ghost btn-xs"
                    onclick="clearEditorText()"
                  >
                    清空
                  </button>
                </div>
              </div>
            </div>

            <!-- History / Saved Essays List -->
            <div class="writer-card-box" style="margin-top: 1.25rem">
              <div class="writer-box-label">
                <span>📚 我的作文草稿库</span>
                <button
                  class="btn btn-ghost btn-xs"
                  onclick="loadWriterEssays()"
                >
                  刷新
                </button>
              </div>
              <div id="writer-essay-list" class="writer-essay-list">
                <div class="writer-empty-tip">暂无保存的作文</div>
              </div>
            </div>
          </div>

          <!-- Right Area: Sidebar for Diagnostics & Details -->
          <aside id="writer-panel" class="writer-sidebar">
            <!-- Tab Navigation -->
            <div class="writer-panel-tabs">
              <button
                id="wtab-btn-diag"
                class="writer-tab-btn active"
                onclick="switchWriterPanelTab('diag')"
              >
                🔍 诊断分析
              </button>
              <button
                id="wtab-btn-problems"
                class="writer-tab-btn"
                onclick="switchWriterPanelTab('problems')"
              >
                📋 问题清单
                <span id="wtab-problems-badge" class="writer-tab-badge hidden"
                  >0</span
                >
              </button>
              <button
                id="wtab-btn-versions"
                class="writer-tab-btn"
                onclick="switchWriterPanelTab('versions')"
              >
                📜 版本快照
              </button>
            </div>

            <!-- Pane 1: Diagnostics -->
            <div id="wpane-diag" class="writer-pane active">
              <!-- CEFR & Summary Badge Card -->
              <div class="writer-sidebar-card">
                <div class="sidebar-section-title">📊 语言水平与质量估测</div>
                <div id="writer-cefr" class="writer-cefr-box">
                  <div class="writer-cefr-level">CEFR —</div>
                  <div class="writer-cefr-desc">
                    输入德语作文以评估词汇难度与错误率
                  </div>
                </div>
              </div>

              <!-- Selected Error / Detail Card -->
              <div class="writer-sidebar-card">
                <div class="sidebar-section-title">🔍 错误诊断与纠错详解</div>
                <div id="writer-err-detail" class="writer-err-detail-box">
                  <div class="writer-err-placeholder">
                    <div style="font-size: 2rem; margin-bottom: 0.5rem">✍️</div>
                    <div>
                      点击编辑器中的<b>彩色波浪下划线</b>，查看错误成因与修正建议，并支持一键替换与存卡。
                    </div>
                  </div>
                </div>
              </div>

              <!-- Sentence Navigation Card -->
              <div class="writer-sidebar-card">
                <div class="sidebar-section-title">🧭 句子导航索引</div>
                <div id="writer-sent-nav" class="writer-sent-nav-list">
                  <div class="writer-empty-tip" style="padding: 0.5rem 0">
                    输入文本后生成句子索引
                  </div>
                </div>
              </div>
            </div>

            <!-- Pane 2: Problems List (v4.2.0) -->
            <div id="wpane-problems" class="writer-pane hidden">
              <div class="writer-sidebar-card">
                <div
                  class="sidebar-section-title"
                  style="
                    display: flex;
                    justify-content: space-between;
                    align-items: center;
                  "
                >
                  <span>📋 全篇问题清单</span>
                  <span
                    id="writer-problems-stat"
                    class="writer-problems-stat-pill"
                    >0 处问题</span
                  >
                </div>
                <div id="writer-problem-list" class="writer-problem-list">
                  <div class="writer-empty-tip">暂无待处理语法问题</div>
                </div>
              </div>
            </div>

            <!-- Pane 2: Version History -->
            <div id="wpane-versions" class="writer-pane hidden">
              <!-- Manual Snapshot Card -->
              <div class="writer-sidebar-card">
                <div class="sidebar-section-title">💾 保存当前快照</div>
                <div style="display: flex; gap: 0.5rem; margin-top: 0.5rem">
                  <input
                    id="writer-version-msg"
                    type="text"
                    class="modal-input"
                    placeholder="快照描述（如：完成引言 / AI 润色后）..."
                    maxlength="50"
                    style="font-size: 0.8125rem; padding: 0.375rem 0.5rem"
                  />
                  <button
                    class="btn btn-dark btn-sm"
                    onclick="saveEssayVersion()"
                    style="white-space: nowrap"
                  >
                    保存当前快照
                  </button>
                </div>
              </div>

              <!-- Version Snapshots List Container -->
              <div class="writer-sidebar-card" style="margin-top: 0.75rem">
                <div
                  class="sidebar-section-title"
                  style="
                    display: flex;
                    justify-content: space-between;
                    align-items: center;
                  "
                >
                  <span>🕒 快照历史</span>
                  <button
                    class="btn btn-ghost btn-xs"
                    onclick="loadEssayVersions()"
                  >
                    刷新
                  </button>
                </div>
                <div id="writer-version-list" class="writer-version-list">
                  <div class="writer-empty-tip">
                    暂无版本记录（请先保存或打开作文）
                  </div>
                </div>
              </div>
            </div>
          </aside>
        </div>
      </div>
    </main>
