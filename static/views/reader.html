    <!-- ── View 2: Reader Workspace ───────────────────────────── -->
    <main id="view-reader" class="view">
      <div class="reader-topbar">
        <button class="btn btn-ghost" onclick="show('home')">← 返回文库</button>
        <h2 id="reader-title"></h2>
        <div class="reader-controls">
          <div id="reader-meta-badge" class="mini-level-badge mini-level-A1">
            A1 推荐
          </div>
          <button
            id="btn-reader-play"
            class="btn btn-dark"
            onclick="ShadowPlayer.toggle()"
            title="开始/暂停全文影子跟读朗读"
            style="font-size: 0.75rem; min-height: 30px; padding: 0 0.65rem"
          >
            ▶ 影子朗读
          </button>
          <button
            class="btn btn-accent"
            onclick="openClozeModal()"
            title="为当前文章生成歌德考点完形填空 / C-Test 实战训练"
            style="font-size: 0.75rem; min-height: 30px; padding: 0 0.65rem"
          >
            ⚔ 完形实战
          </button>
          <button
            class="btn btn-ghost"
            onclick="downloadStudyGuide()"
            title="一键导出全文划线、词汇与考点为 Markdown 精读讲义"
            style="font-size: 0.75rem; min-height: 30px; padding: 0 0.65rem"
          >
            📥 导出讲义
          </button>
          <div class="typo-pill">
            <button
              id="btn-font-sans"
              class="typo-btn active"
              onclick="setFontMode('sans')"
              title="切换为清爽现代黑体"
            >
              黑体
            </button>
            <button
              id="btn-font-serif"
              class="typo-btn"
              onclick="setFontMode('serif')"
              title="切换为经典书卷衬线体"
            >
              衬线
            </button>
            <span class="typo-sep"></span>
            <button
              class="typo-btn"
              onclick="adjustFontSize(-1)"
              title="减小正文字号"
            >
              A-
            </button>
            <button
              class="typo-btn"
              onclick="adjustFontSize(1)"
              title="加大正文字号"
            >
              A+
            </button>
          </div>
        </div>
      </div>

      <!-- CEFR Distribution Heatbar & Info -->
      <div id="reader-heatbar-wrap" class="reader-heatbar-wrap">
        <div class="heatbar-label">
          <span>欧标难度分布 · CEFR SPECTRUM</span>
          <span
            id="heatbar-time"
            style="
              font-family: var(--mono);
              color: var(--pencil);
              font-size: 0.75rem;
            "
          ></span>
        </div>
        <div id="reader-heatbar" class="reader-heatbar"></div>
      </div>

      <div id="reader-content" lang="de"></div>
    </main>
