<!--
  lucide-sprite.svg —— Lucide 图标 sprite（同文档引用，全部经 <use href="#ui-ico-*">）

  来源：https://github.com/lucide-icons/lucide  lucide-static v0.468.0
  许可：ISC（见 static/icons/LICENSE-lucide.txt）
  只收录本项目实际用到的 16 个图标，不复制整套图标库。
  新增图标时同步更新 static/icons/README.md 的清单与版本。

  用法（同文档）：
    <svg class="ui-ico" aria-hidden="true" focusable="false"><use href="#ui-ico-volume-2"></use></svg>
