<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DeLector — 德语欧标沉浸阅读</title>
  <meta name="description" content="导入德语文章，智能标注 CEFR 等级，解析歌德核心考点，一键导出 Anki 卡片。">
  <link rel="stylesheet" href="/style.css">
</head>
<body>

  <nav id="nav">
    <div class="nav-brand" onclick="show('home')">
      DeLector <sup>歌德欧标</sup>
    </div>
    <div class="nav-actions">
      <button class="btn btn-ghost" onclick="show('cards')">卡片库 (<span id="card-count">0</span>)</button>
      <a href="/api/cards/export/apkg" class="btn btn-ink">导出 Anki</a>
    </div>
  </nav>

  <!-- Home -->
  <div id="view-home" class="view active">
    <div class="home-hero">
      <h1>德语欧标<br>沉浸阅读与考点剖析</h1>
      <p>导入任意德语课文或新闻，本地智能标注 CEFR 等级，<br>实时解析歌德核心考点并导出 Anki 卡片。</p>
      <div class="home-cta">
        <button class="btn btn-prussian" onclick="openModal()">+ 导入德语文章</button>
      </div>
    </div>

    <div class="cefr-legend">
      <strong>欧标难度：</strong>
      <span class="legend-pip pip-A2">A2 进阶</span>
      <span class="legend-pip pip-B1">B1 中级</span>
      <span class="legend-pip pip-B2">B2 高级</span>
      <span class="legend-pip pip-C1">C1 精通</span>
    </div>

    <p class="section-eyebrow">文稿库</p>
    <div id="article-list"></div>
  </div>

  <!-- Reader -->
  <div id="view-reader" class="view">
    <div class="reader-topbar">
      <button class="btn btn-ghost" onclick="show('home')">← 返回</button>
      <h2 id="reader-title"></h2>
      <div style="width:72px"></div>
    </div>
    <div id="reader-content"></div>
  </div>

  <!-- Cards -->
  <div id="view-cards" class="view">
    <div class="cards-topbar">
      <button class="btn btn-ghost" onclick="show('home')">← 返回</button>
      <h2>待复习卡片库</h2>
      <a href="/api/cards/export/apkg" class="btn btn-ink">导出 Anki</a>
    </div>
    <div id="cards-container"></div>
  </div>

  <!-- Drawer (warm zone) -->
  <aside id="drawer">
    <div class="drawer-header">
      <span class="drawer-label">词汇 &amp; 考点工作台</span>
      <button class="drawer-close" onclick="closeDrawer()">✕</button>
    </div>
    <div class="drawer-body">

      <!-- Karteikarte Signature Element -->
      <div class="karteikarte">
        <div class="karte-head">
          <span id="d-word"></span>
          <span class="cefr-badge" id="d-cefr"></span>
        </div>
        <div class="karte-body">
          <div id="d-meta"></div>
          <div>
            <label class="field-label">中文释义</label>
            <input id="d-def" type="text" class="def-input" placeholder="输入中文释义…">
          </div>
          <button id="save-vocab-btn" class="btn btn-prussian btn-full" onclick="saveVocab()">
            + 加入 Anki 词汇卡
          </button>
        </div>
      </div>

      <div class="grammar-section">
        <div class="grammar-section-head">
          <span>歌德考点深度剖析</span>
          <button id="analyze-btn" class="btn btn-prussian" style="min-height:28px;padding:0 .625rem;font-size:.75rem"
            onclick="analyzeGrammar()">AI 深度剖析</button>
        </div>
        <div id="grammar-result" class="grammar-detail hidden">
          <div style="display:flex;align-items:baseline;gap:.5rem">
            <span id="g-name"></span>
            <span class="cefr-badge" id="g-badge"></span>
          </div>
          <div id="g-formula" class="hidden"></div>
          <div id="g-exp"></div>
          <button id="save-grammar-btn" class="btn btn-ghost btn-full" onclick="saveGrammar()">
            + 加入 Anki 语法卡
          </button>
        </div>
      </div>

      <div class="context-section">
        <span class="field-label">原句上下文</span>
        <div id="d-sent"></div>
      </div>

    </div>
  </aside>

  <!-- Import modal -->
  <div id="modal-overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <h3>导入德语研读材料</h3>
      <div class="modal-field">
        <input id="imp-title" type="text" class="modal-input" placeholder="文章标题（可选）">
      </div>
      <div class="modal-field">
        <textarea id="imp-text" class="modal-input modal-textarea" placeholder="粘贴德语文章、课文或短讯…"></textarea>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" onclick="closeModal()">取消</button>
        <button id="import-btn" class="btn btn-ink" onclick="submitImport()">开始阅读</button>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
