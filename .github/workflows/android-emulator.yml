name: Android Emulator APK

# 模拟器专用构建入口：手动触发，只产出 emulator 变体 APK。
# 与 build-release.yml 完全解耦——不挂 tag / push 触发，不写 dist/ 下的发版产物路径，
# artifact 也用独立名称，避免发版 job 抓错包。
# 依赖链已由 2026-11-04 一次性探针验证（x86_64 全量 wheel 可用，含 srsly）。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-emulator-apk:
    name: Build emulator APK (arm64-v8a + x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Set up Gradle 8.6
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.6"

      - name: Set up Python for model syncing
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install spaCy (APK runtime version)
        run: pip install "spacy>=3.8,<3.9"

      # 504 治理：见 tools/download_spacy_model.py 的模块 docstring（有界重试 + wheel 缓存）。
      - name: Restore spaCy German model wheel
        uses: actions/cache@v4
        with:
          path: .spacy-wheel-cache
          key: spacy-model-de_core_news_sm-3.8.0-${{ runner.os }}-py311

      - name: Install spaCy German model (cached wheel + bounded retry)
        run: python tools/download_spacy_model.py --cache-dir .spacy-wheel-cache

      # 与 build-release.yml 的 Android job 逐项同源：同样的模型兼容断言与目录布局，
      # 否则「模拟器包能跑」证明不了正式包的同一套资产装配。
      - name: Sync Python Backend, Model, and Assets into Android Project
        run: |
          python - <<'PY'
          import spacy
          APK_SPACY = "3.8.7"
          compat = spacy.info("de_core_news_sm")["spacy_version"]
          from spacy.util import is_compatible_version
          assert is_compatible_version(APK_SPACY, compat), \
              f"模型要求 spaCy {compat}，与 APK 内的 {APK_SPACY} 不兼容"
          print(f"模型 compat={compat} 与 APK spaCy {APK_SPACY} 匹配")
          PY
          mkdir -p android/app/src/main/python
          cp -r start.py android/app/src/main/python/
          cp -r delector android/app/src/main/python/
          MODEL_DIR=$(python -c "import de_core_news_sm, os; print(os.path.dirname(de_core_news_sm.__file__))")
          cp -r "$MODEL_DIR" android/app/src/main/python/de_core_news_sm
          MODEL_DISTINFO=$(python -c "import glob, os, de_core_news_sm as m; base = os.path.dirname(os.path.dirname(m.__file__)); hits = glob.glob(os.path.join(base, 'de_core_news_sm-*.dist-info')); assert hits, '未找到 de_core_news_sm dist-info'; print(hits[0])")
          cp -r "$MODEL_DISTINFO" android/app/src/main/python/
          mkdir -p android/app/src/main/assets
          cp -r static android/app/src/main/assets/

      - name: Build emulator APK
        working-directory: ./android
        run: gradle assembleEmulatorDebug --stacktrace

      # 体积与 ABI 证据：模拟器包必须真含 x86_64，否则「能装进模拟器」只是名义上的。
      - name: Verify emulator APK contents
        run: |
          APK="android/app/build/outputs/apk/emulator/debug/app-emulator-debug.apk"
          test -f "$APK" || { echo "::error::未找到 $APK"; exit 1; }
          size_bytes=$(stat -c %s "$APK")
          echo "模拟器 APK：${size_bytes} bytes（$(awk "BEGIN{printf \"%.2f\", $size_bytes/1048576}") MiB）"
          unzip -l "$APK" | grep -q "lib/x86_64/" || { echo "::error::APK 缺 lib/x86_64/"; exit 1; }
          unzip -l "$APK" | grep -q "requirements-x86_64\.imy" || { echo "::error::APK 缺 requirements-x86_64.imy"; exit 1; }
          unzip -l "$APK" | grep -q "lib/arm64-v8a/" || { echo "::error::APK 缺 lib/arm64-v8a/"; exit 1; }
          echo "模拟器 APK 含 arm64-v8a + x86_64 双 ABI"

      - name: Upload emulator APK
        uses: actions/upload-artifact@v7
        with:
          name: DeLector-emulator-apk
          path: android/app/build/outputs/apk/emulator/debug/app-emulator-debug.apk
          if-no-files-found: error
          retention-days: 30
