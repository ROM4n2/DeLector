name: Build & Publish DeLector Releases

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64 Portable
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: "utf-8"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pytest
          python -m spacy download de_core_news_sm

      - name: Run Tests
        run: |
          pytest -v

      - name: Build Windows Portable Release
        run: |
          python package_windows.py
          $zipName = "DeLector-${{ github.ref_name }}-Windows-x64-Portable.zip"
          Get-ChildItem -Path dist -Directory -Filter "DeLector-*-Windows-x64-Portable" | ForEach-Object {
            Compress-Archive -Path $_.FullName -DestinationPath "dist/$zipName" -Force
          }

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeLector-Windows-Portable
          path: dist/DeLector-*.zip

  build-linux:
    name: Build Linux x64 Portable
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pytest
          python -m spacy download de_core_news_sm

      - name: Run Tests
        run: |
          pytest -v

      - name: Build Linux Portable
        run: |
          python -m PyInstaller \
            --name=DeLector \
            --onedir \
            --noconfirm \
            --clean \
            --add-data="static:static" \
            --hidden-import=uvicorn.logging \
            --hidden-import=uvicorn.loops \
            --hidden-import=uvicorn.loops.auto \
            --hidden-import=uvicorn.protocols \
            --hidden-import=uvicorn.protocols.http \
            --hidden-import=uvicorn.protocols.http.auto \
            --hidden-import=uvicorn.protocols.websockets \
            --hidden-import=uvicorn.protocols.websockets.auto \
            --hidden-import=uvicorn.lifespan \
            --hidden-import=uvicorn.lifespan.on \
            --hidden-import=core_dict_ext \
            --hidden-import=prep_dict \
            --hidden-import=a1_dict \
            --hidden-import=a1_writing_dict \
            --hidden-import=de_core_news_sm \
            --hidden-import=spacy.lang.de \
            --hidden-import=genanki \
            --hidden-import=edge_tts \
            --hidden-import=httpx \
            --collect-all=de_core_news_sm \
            --collect-all=spacy \
            start.py
          mkdir -p dist/DeLector-${{ github.ref_name }}-Linux-x64
          cp -r dist/DeLector/* dist/DeLector-${{ github.ref_name }}-Linux-x64/
          tar -czf dist/DeLector-${{ github.ref_name }}-Linux-x64.tar.gz -C dist DeLector-${{ github.ref_name }}-Linux-x64

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeLector-Linux-Portable
          path: dist/DeLector-*-Linux-x64.tar.gz

  build-macos:
    name: Build macOS Portable
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pytest
          python -m spacy download de_core_news_sm

      - name: Run Tests
        run: |
          pytest -v

      - name: Build macOS Portable
        run: |
          python -m PyInstaller \
            --name=DeLector \
            --onedir \
            --noconfirm \
            --clean \
            --add-data="static:static" \
            --hidden-import=uvicorn.logging \
            --hidden-import=uvicorn.loops \
            --hidden-import=uvicorn.loops.auto \
            --hidden-import=uvicorn.protocols \
            --hidden-import=uvicorn.protocols.http \
            --hidden-import=uvicorn.protocols.http.auto \
            --hidden-import=uvicorn.protocols.websockets \
            --hidden-import=uvicorn.protocols.websockets.auto \
            --hidden-import=uvicorn.lifespan \
            --hidden-import=uvicorn.lifespan.on \
            --hidden-import=core_dict_ext \
            --hidden-import=prep_dict \
            --hidden-import=a1_dict \
            --hidden-import=a1_writing_dict \
            --hidden-import=de_core_news_sm \
            --hidden-import=spacy.lang.de \
            --hidden-import=genanki \
            --hidden-import=edge_tts \
            --hidden-import=httpx \
            --collect-all=de_core_news_sm \
            --collect-all=spacy \
            start.py
          mkdir -p dist/DeLector-${{ github.ref_name }}-macOS
          cp -r dist/DeLector/* dist/DeLector-${{ github.ref_name }}-macOS/
          tar -czf dist/DeLector-${{ github.ref_name }}-macOS.tar.gz -C dist DeLector-${{ github.ref_name }}-macOS

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeLector-macOS-Portable
          path: dist/DeLector-*-macOS.tar.gz

  build-android:
    name: Build Android Standalone APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.6"

      - name: Set up Python for model syncing
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Sync Python Backend, Model, and Assets into Android Project
        run: |
          pip install "spacy>=3.8,<3.9"
          python -m spacy download de_core_news_sm
          python - <<'PY'
          import spacy
          APK_SPACY = "3.8.7"
          compat = spacy.info("de_core_news_sm")["spacy_version"]
          from spacy.util import is_compatible_version
          assert is_compatible_version(APK_SPACY, compat), \
              f"模型要求 spaCy {compat}，与 APK 内的 {APK_SPACY} 不兼容"
          print(f"模型 compat={compat} 与 APK spaCy {APK_SPACY} 匹配")
          PY
          mkdir -p android/app/src/main/python
          cp -r server.py start.py core_dict.py core_dict_ext.py prep_dict.py linguistics.py syntax_tree.py edge_tts_mini.py writing_rules.py essay_diff.py nlp.py database.py security.py android/app/src/main/python/
          MODEL_DIR=$(python -c "import de_core_news_sm, os; print(os.path.dirname(de_core_news_sm.__file__))")
          cp -r "$MODEL_DIR" android/app/src/main/python/de_core_news_sm
          mkdir -p android/app/src/main/assets
          cp -r static android/app/src/main/assets/

      - name: Derive Version from Git Tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            MAJOR="${BASH_REMATCH[1]}"
            MINOR="${BASH_REMATCH[2]}"
            PATCH="${BASH_REMATCH[3]}"
            VER="${MAJOR}.${MINOR}.${PATCH}"
            CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
            echo "从 tag $TAG 推导版本 $VER (code $CODE)"
          else
            # workflow_dispatch 或非 tag 触发：直接读 build.gradle 的 fallback，
            # 不在这里另存一份副本 —— 原来硬编码的是 4.4.0/40400，而 build.gradle
            # 早已走到别的版本，副本一定会漂。漂了的后果不是构建失败而是产出一个
            # versionCode 偏小的 APK：装不上现有设备（versionCode 必须严格递增），
            # 且 v4.4.5 起的资产解包闸会拿这个错版本号去比标记。
            VER=$(sed -n 's/.*DELECTOR_VERSION_NAME") *?: *"\([0-9.]*\)".*/\1/p' android/app/build.gradle)
            CODE=$(sed -n 's/.*DELECTOR_VERSION_CODE") *?: *"\([0-9]*\)".*/\1/p' android/app/build.gradle)
            if [[ -z "$VER" || -z "$CODE" ]]; then
              echo "::error::读不出 build.gradle 的 fallback 版本，拒绝构建无版本号的包"
              exit 1
            fi
            echo "非 tag 触发，沿用 build.gradle fallback 版本 $VER (code $CODE)"
          fi
          echo "name=$VER" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Decode Pinned Signing Keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          # 为什么这里要硬失败而不是优雅跳过：secret 缺失/改名时 gradle 会静默回落到
          # AGP 自动生成的随机 debug keystore，产出一个看起来正常、却与已发布版本
          # 签名不一致的 APK —— 用户装不上、也再也收不到升级。这类静默失效必须变红。
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::secret ANDROID_DEBUG_KEYSTORE_B64 为空或未配置"
            exit 1
          fi
          # 解到 $RUNNER_TEMP：keystore 永不进入工作树，即使 .gitignore 或
          # pre-commit 钩子将来被改坏，误提交在物理上也不可能。
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/delector-debug.jks"
          # 立刻验一次读得开，否则口令错/base64 截断要等到签名阶段才炸，离根因很远
          keytool -list -keystore "$RUNNER_TEMP/delector-debug.jks" \
                  -storepass "$KEYSTORE_PASSWORD" > /dev/null
          echo "keystore 已解码并验证可读"

      - name: Build Android APK
        working-directory: ./android
        env:
          DELECTOR_VERSION_NAME: ${{ steps.version.outputs.name }}
          DELECTOR_VERSION_CODE: ${{ steps.version.outputs.code }}
          DELECTOR_KEYSTORE_PATH: ${{ runner.temp }}/delector-debug.jks
          DELECTOR_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          DELECTOR_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          DELECTOR_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle assembleDebug --stacktrace

      - name: Locate and Rename APK
        run: |
          mkdir -p dist
          # 写死 debug 变体的输出路径：原来的 find -name "*.apk" 在有多个变体
          # （或残留产物）时会随机抓一个，且 -exec cp 多次命中会互相覆盖，
          # 最后打包进 Release 的是哪一个不确定。
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK" || { echo "::error::未找到 $APK"; exit 1; }
          cp "$APK" "dist/DeLector-${{ github.ref_name }}-Android.apk"

      - name: Verify APK Signing Certificate
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          # 期望指纹是公开信息（谁都能从已发布 APK 里读出来），明文写在这里即可。
          # 这一道拦的是「keystore 被换成另一份合法 keystore」——
          # 那会让所有已安装用户永远收不到升级，而下面的自比对发现不了。
          # 格式必须与 keytool 输出一致：大写、冒号分隔。
          EXPECTED_SHA256: "9A:8A:6D:B6:64:CE:A9:40:C9:42:A7:57:5D:AD:0D:01:5D:28:A9:BC:4E:BD:CC:7A:1B:5D:DE:65:06:0A:57:9C"
        run: |
          # 用 keytool 而非 apksigner：本 job 显式装了 JDK 17，keytool 路径确定；
          # apksigner 属 build-tools，路径含版本号段且不在 PATH 上，
          # 将来 AGP 换版本时那道闸会静默失效——静默失效的签名闸比没有闸更糟。
          apk_fp=$(keytool -printcert -jarfile "dist/DeLector-${{ github.ref_name }}-Android.apk" \
                   | awk '/SHA256:/ {print toupper($2); exit}')
          ks_fp=$(keytool -list -v -keystore "$RUNNER_TEMP/delector-debug.jks" \
                   -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" \
                   | awk '/SHA256:/ {print toupper($2); exit}')
          echo "APK      证书指纹: ${apk_fp:-<空>}"
          echo "keystore 证书指纹: ${ks_fp:-<空>}"
          if [ -z "$apk_fp" ] || [ -z "$ks_fp" ]; then
            echo "::error::读不出证书指纹，签名闸无法判定"
            exit 1
          fi
          # 两道断言拦的是不同的失效方式，都不能省：
          # 自比对拦「secret 缺失 → 回落随机 debug 签名」，
          # 定值比对拦「keystore 被换成另一份合法 keystore」（自比对照样会过）。
          if [ "$apk_fp" != "$ks_fp" ]; then
            echo "::error::APK 未用钉死的 keystore 签名（很可能回落到了随机 debug 签名）"
            exit 1
          fi
          if [ "$apk_fp" != "$EXPECTED_SHA256" ]; then
            echo "::error::证书指纹与预期不符，keystore 可能被换了：期望 $EXPECTED_SHA256"
            exit 1
          fi
          echo "签名验证通过"

      - name: Verify APK Contains NLP Assets via app.imy
        run: |
          APK="dist/DeLector-${{ github.ref_name }}-Android.apk"
          test -f "$APK" || { echo "::error::APK not found at $APK"; exit 1; }
          echo "检查 APK 内部打包产物 (assets/chaquopy/app.imy)..."
          # APK 内的 Python 代码与模型被打进 app.imy，而非 APK 根目录；
          # 直接在 APK 根目录 grep server.py 会误判为缺失（静默漏检）。
          if ! unzip -l "$APK" | grep -q "assets/chaquopy/app.imy"; then
            echo "::error::APK 缺少 assets/chaquopy/app.imy（Chaquopy 打包容器）"
            exit 1
          fi
          python - <<'PY'
          import zipfile, io, glob, sys
          apk_files = glob.glob("dist/DeLector-*-Android.apk")
          if not apk_files:
              print("::error::未找到 APK", file=sys.stderr)
              sys.exit(1)
          apk = apk_files[0]
          with zipfile.ZipFile(apk) as z:
              namelist = z.namelist()
              assert "assets/chaquopy/app.imy" in namelist, "APK 缺少 assets/chaquopy/app.imy"
              # app.imy 装应用自身代码 + CI 拷入的模型目录；pip 依赖（spacy/thinc）
              # 在 requirements-<abi>.imy —— v4.4.0 首跑实测把 spacy/thinc 塞进
              # app.imy 检查会误报缺失。两个容器各查各的。
              APP_NEEDLES = ("server.py", "de_core_news_sm")
              REQ_NEEDLES = ("spacy", "thinc")
              def find_in(data):
                  found = set()
                  try:
                      with zipfile.ZipFile(io.BytesIO(data)) as inner:
                          names = inner.namelist()
                          for needle in APP_NEEDLES + REQ_NEEDLES:
                              if any(needle in n for n in names):
                                  found.add(needle)
                  except zipfile.BadZipFile:
                      pass
                  for needle in APP_NEEDLES + REQ_NEEDLES:
                      if needle not in found and needle.encode() in data:
                          found.add(needle)
                  return found
              app_found = find_in(z.read("assets/chaquopy/app.imy"))
              req_imy = [n for n in namelist if n.startswith("assets/chaquopy/requirements") and n.endswith(".imy")]
              if not req_imy:
                  print("::error::APK 缺少 requirements imy（原生依赖容器）", file=sys.stderr)
                  sys.exit(1)
              req_found = set()
              for rn in req_imy:
                  req_found |= find_in(z.read(rn))
              missing_app = [n for n in APP_NEEDLES if n not in app_found]
              missing_req = [n for n in REQ_NEEDLES if n not in req_found]
              if missing_app:
                  print(f"::error::app.imy 缺少: {', '.join(missing_app)}", file=sys.stderr)
                  sys.exit(1)
              if missing_req:
                  print(f"::error::requirements imy 缺少: {', '.join(missing_req)}", file=sys.stderr)
                  sys.exit(1)
              print(f"requirements imy: {req_imy}")
              print(f"APK NLP 资产验证通过: app.imy={sorted(app_found)}, requirements={sorted(req_found)}")
          PY

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeLector-Android-APK
          path: dist/DeLector-*-Android.apk

  publish-github-release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux, build-macos, build-android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: DeLector-Windows-Portable
          path: dist/

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: DeLector-Linux-Portable
          path: dist/

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: DeLector-macOS-Portable
          path: dist/

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: DeLector-Android-APK
          path: dist/

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/DeLector-*.zip
            dist/DeLector-*.tar.gz
            dist/DeLector-*.apk
          name: DeLector ${{ github.ref_name }} — 德语学术精读与备考工作台
          body: |
            ## 🌟 DeLector ${{ github.ref_name }} 正式发布

            面向德语精读与歌德（Goethe A1–C1）、德福（TestDaF）、DSH 备考者的本地优先学术级伴读工作台。

            ### 📦 多平台下载与安装
            - 🪟 **Windows 桌面免安装绿色版**：`DeLector-${{ github.ref_name }}-Windows-x64-Portable.zip`（解压即用，双击 `DeLector.exe` 秒级启动）
            - 🍎 **macOS 桌面免安装包**：`DeLector-${{ github.ref_name }}-macOS.tar.gz`（解压运行 `start` 即可，开箱即用）
            - 🐧 **Linux 桌面便携版**：`DeLector-${{ github.ref_name }}-Linux-x64.tar.gz`（解压运行 `start`，全发行版通用）
            - 📱 **Android 独立单机安装包**：`DeLector-${{ github.ref_name }}-Android.apk`（嵌入式 Python 运行时与离线 TTS 桥接，100% 独立离线单机运行）

            ### 🚀 核心特性
            - 🦉 **德语伴读宠物（Eule & 伙伴）混合双模系统**：4 款内嵌矢量角色 + 自定义 SVG 上传 + 德语原生 TTS 语音发声 + 9 大场景智能鼓励
            - 📊 **Atelier 呼吸感画册落地页台账 (Folio)**：0.85:1.15 不对称 Hero 展台 + 双行反向 Wire Marquee 走字带 + 欧标掌握度阶梯矩阵与 30 天墨线走势
            - 🌳 **德语拓扑五场域 (Felder-Modell) 与 5 大从句树 AST 句法引擎**
            - ⚡ **556+ 强变化动词三态表 + 复合词智能拆解 + 可分动词框形联动**
            - 📖 **0ms 歌德核心离线词库 + CEFR 词阶热力谱 + AI 精读便签**
            - 🎴 **3D 物理翻牌盒 + FSRS 现代认知记忆排程 + Anki .apkg 一键导出**
            - ✍️ **完形填空 & 德福 C-Test 模拟与服务端防作弊判分**
            - 📰 **德语外刊 RSS 一键订阅与文稿库极速管理（支持一键删除）**
          draft: false
          prerelease: false
