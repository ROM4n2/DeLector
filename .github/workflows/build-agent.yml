name: Build Agent Artifacts

# 独立 workflow：仅 tag v* 与手动触发；2b 只出 artifact，不挂 build-release.yml 的
# 发布 job（不发布 release）。本文件不含任何密钥引用，upload-artifact 使用默认
# GITHUB_TOKEN 权限即可。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "语义化版本 X.Y.Z（留空回退 main.go 常量）"
        required: false
        default: ""

jobs:
  build-agent:
    name: Build Agent (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # 三平台并行；任一失败不影响其余（artifact 各自独立）。
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          # setup-go 的 cache 是 boolean（写法区别于 setup-node 的包管理器名）；
          # GitHub runner 输入校验严格化后，"go" 会被拒：Input does not meet
          # YAML 1.2 "Core Schema" specification: cache。
          cache: true
          cache-dependency-path: agent/go.mod

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Derive version from tag
        id: version
        shell: bash
        run: |
          # 优先级：workflow_dispatch 手工注入 > tag（refs/tags/vX.Y.Z 去前缀）>
          # 留空交由 package_agent.py 回退读 main.go。dispatch 注入用于 CI 修复后
          # 补跑 tag 构建（tag 已指向不含修复的 commit，避免重打已发布的 tag）。
          if [[ -n "${{ inputs.version }}" ]]; then
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=" >> "$GITHUB_OUTPUT"
          fi

      - name: Package agent
        env:
          PYTHONIOENCODING: "utf-8"
        run: python agent/scripts/package_agent.py --version "${{ steps.version.outputs.value }}"

      - name: Determine artifact name
        id: meta
        shell: bash
        run: |
          # 产物名 DeLector-Agent-<ver>-<os>-<arch>.(zip|tar.gz)，直接以其基名作
          # artifact 名，天然含真实 os+arch（mac 为 arm64，自动吻合 runner）。
          f=$(ls dist/agent/DeLector-Agent-* | head -n1)
          base=$(basename "$f")
          if [[ "$base" == *.tar.gz ]]; then
            name="${base%.tar.gz}"
          else
            name="${base%.zip}"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.meta.outputs.name }}
          path: dist/agent/DeLector-Agent-*
          if-no-files-found: error
