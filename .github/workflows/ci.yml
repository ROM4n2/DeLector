# =============================================================================
# CI 门禁 workflow：PR / push(master) 即跑全量测试与 Go 三门禁
# =============================================================================
#
# 门禁范围（为何只 ubuntu 单平台）：
#   本 workflow 的职责是"改动是否可用"（质量闸），不是"产物能否打包"。
#   Windows/macOS 构建矩阵留给 tag 触发的 build-release.yml，PR 反馈时长
#   预期 < 8min（pytest ~3-6min + Go 门禁 ~1min）。
#
# 与既有 workflow 的分工：
#   - ci.yml（本文件）  ：pull_request / push(master) / 手动触发 → pytest 全量
#     + gofmt / vet / -race 三门禁（质量闸，改动合入 master 前必须绿）；
#   - build-release.yml：仅 tag v* 触发 → 三平台打包 + Android APK + 发布（打包面）；
#   - build-agent.yml  ：仅 tag v* 触发 → agent 三平台 artifact（分发面）。
#
# cache 写法教训（99-Inbox：GitHub Actions tag 发版三重陷阱）：
#   setup-go@v5 的 cache 参数是 boolean，MUST 写 `cache: true` 并配
#   cache-dependency-path: agent/go.mod；误写成字符串型 "go" 会被 runner
#   直接拒绝（Input does not meet YAML 1.2 "Core Schema" specification）。
#   setup-python 的 cache 才是字符串（"pip"），两者不要混淆。
# =============================================================================
name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

# 同分支新 push 取消仍在跑的旧 CI：省 runner 分钟数、反馈更快
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Python Tests & Mechanical Gates (ubuntu)
    runs-on: ubuntu-latest
    # 卡死护栏：不设时 GitHub Actions 对单个 job 的默认上限是 360 分钟（6 小时），
    # 一条永不返回的测试会把 runner 烧满六小时才红——提交者早改去下一件事了。
    # 取 15：文件头自陈"PR 反馈预期 < 8min"，实测单次约 2.5–3.5min，留足余量。
    timeout-minutes: 15
    strategy:
      matrix:
        suite:
          - name: unit
            args: "--ignore=tests/test_cards_endpoint_cost.py --ignore=tests/test_cold_start_cost.py --ignore=tests/test_articles_list_cost.py"
          - name: cost-guards
            args: "tests/test_cards_endpoint_cost.py tests/test_cold_start_cost.py tests/test_articles_list_cost.py"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      # Node 门禁的显式安装（2026-10-05 清债轮 C 组）。
      # tests/ 下有一批 wrapper 会 `node tools/*.mjs` 真跑 .mjs 行为探针。此前 CI 从不
      # 安装 node，wrapper 之所以"恰好真跑"靠的是 ubuntu-latest 镜像**预装**的 Node 20.x
      # —— 属隐式依赖：镜像一旦换版本/摘掉预装，探针会走 `shutil.which("node")` 守卫
      # **静默 skip**，测试全绿而探针根本没跑（比红更坏：回归无声溜过）。
      # 固定 major '20'（对齐 runner 自带的 20.x），MUST NOT 用 latest（不可复现）。
      - name: Set up Node 20
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      # 不装 pyinstaller——那是打包面（build-release.yml 的职责）
      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      # Ruff 静态门禁（2026-09-13 ruff-cleanup）。
      # ruff 是开发期工具：CI 内单独安装，**不进 requirements.txt**（混入运行时依赖
      # 会增大 Android 打包面体积与漂移面）。放在 spaCy 模型下载与全量测试之前——
      # lint 是秒级检查，先失败先反馈，省下长测试的等待。
      - name: Install Ruff
        run: pip install ruff

      - name: Ruff lint gate
        run: ruff check .

      # Mypy 类型门禁（2026-09-13 mypy-cleanup 起步；2026-09-18 strict 清账升级）。
      # 开发期工具：CI 内单独安装，**不进 requirements.txt**（Android 运行时纯净）。
      # 档位：--strict 覆盖 delector + tools 零错误（delector 250→0、tools 108→0，
      # 见 docs/specs/2026-09-18-mypy-strict-annotation-sweep-design.md）；tests
      # 保持适度档（pytest 测试函数注解收益低，另立评估），--follow-imports=skip
      # 只查 tests 自身（避免 delector 的 strict ignore 在配置档下 unused 冲突）。
      - name: Install Mypy
        run: pip install mypy

      - name: Mypy type gate (strict)
        run: mypy --strict delector tools

      - name: Mypy type gate (tests, config baseline)
        run: mypy --follow-imports=skip tests

      # Mypy 类型门禁（新入口裸露面，2026-10-10 windows-desktop-shell 收口）。
      # 上面两条门禁都**显式传了目标**（`--strict delector tools` / `--follow-imports=skip tests`），
      # 故仓库根的 desktop.py / conftest.py / package_windows.py / start.py **从不被检查**；pyproject
      # 的 `files` 只影响"本地裸跑 python -m mypy"（且裸跑会因既有 17 条无关错误转红），CI 不裸跑。
      # 口径：`--follow-imports=skip` 只查目标文件自身（不把既有 delector 模块的 unused-ignore 卷进来，
      # 与 tests 门禁同款）+ `--strict`（对齐 headline 档）。start.py 此前因两处 `# type: ignore` 在 skip
      # 下变 unused-ignore 而**卡住**（禁新增豁免）⇒ 一直未纳入；2026-10 用 setattr 按名赋值覆盖两代
      # uvicorn 信号 API、去掉那两处 ignore 后并入本条（ADR-0021 替代投资#2）。
      - name: Mypy type gate (desktop entry surface, strict)
        # MUST 带 `--platform win32`：desktop.py 是本项目 **Windows 专属**入口，源码用
        # `ctypes.windll` 与 `winreg.*`；mypy **默认按运行平台**（CI 是 ubuntu）挑 typeshed，
        # Linux 下这两个模块没有 windll / OpenKey / KEY_READ / QueryValueEx / CloseKey 等属性
        # ⇒ 报 5 处 attr-defined（本地 Windows 绿、CI 红 —— 门禁结果随平台漂移，是设计缺陷）。
        # 显式声明 `--platform win32` 使门禁与该文件真实目标平台一致：这正是它 2026-10-10
        # 第一次上线就在 CI 红掉的原因，别再顺手删掉。
        run: mypy --platform win32 --strict --follow-imports=skip desktop.py package_windows.py conftest.py start.py

      # 测试需要德语 spaCy 模型，与 build-release.yml 同源
      - name: Download spaCy German model
        run: python -m spacy download de_core_news_sm

      # ── 前端跨边界门禁（ADR-0021「替代投资#3」，改口径版）─────────────────────
      # 为什么是这两条而不是「全量 checkJs」：实测全量 --allowJs --checkJs 共 219 条存量
      # 错误，其中 199 条是缺 DOM 声明的 TS2339 噪音 ⇒ 全量接线 = 永远红的噪音源。故：
      #   ① 路由契约（主仪器）：用**真实** app.routes 校验 static/js 里真实存在的 HTTP
      #      调用，调了未注册端点 ⇒ 非零退出。纯 Python、快、确定性强，作为**阻塞**步。
      #   ② API 边界类型（次仪器）：固定 typescript@5.6.3，只查 tsconfig.json 的**显式
      #      allowlist**（逐个文件列出，见 tsconfig.json 与 static/js/api-types.js 顶部）。
      - name: Frontend API contract gate (routes)
        run: python tools/check_frontend_api_contract.py

      # ── 前端 index.html 模板装配同步门禁 ──────────────────────────────────
      - name: Frontend index.html template sync gate
        run: python tools/check_index_html_sync.py

      # ── 前端分层与模块图完整性门禁（2026-10-19 writer.js 分层）─────────────────
      # 判据见 tools/check_frontend_layers.py 与 docs/plans/2026-10-19-writer-js-modularization.md。
      # 与上面那条互补、**刻意不重复**：路由契约闸管**路径**存在性；本闸补**方法**一致性
      # （实测：把 method: 'DELETE' 改成 'POST' 时上面那条闸 exit 0 —— 抓不到），
      # 另管 L1/L2 分层禁令、反向依赖、越界 import、重复声明（ES 链接期 SyntaxError，
      # 会让整张模块图一起挂）、以及「抽了但留副本」的假解耦。
      # 需 delector.server 取真实路由表 ⇒ 必须挂在已装依赖的这个 job 下（不是纯 stdlib 闸）。
      - name: Frontend layer invariants gate
        run: python tools/check_frontend_layers.py

      # 固定 typescript@5.6.3（对齐本会话实测可用版本；MUST NOT 用 latest —— 不可复现）。
      - name: Frontend API-boundary type gate (tsc)
        run: npx --yes -p typescript@5.6.3 tsc --noEmit

      # 全量门禁：Python 测试套件一个不漏
      - name: Run full pytest suite
        run: pytest -q ${{ matrix.suite.args }}

  # ── Go 智能体运行时门禁（解耦并行，25s 极速自证）─────────────────────────────────
  go-gates:
    name: Go Gates (agent runtime, race detector)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go 1.26
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          # cache 是 boolean（区别于 setup-python 的字符串 "pip"）；
          # 误写成字符串 "go" 会被 runner 直接拒绝——99-Inbox 真实事故，勿改。
          cache: true
          cache-dependency-path: agent/go.mod

      # 格式门禁：gofmt -l 有输出即失败（Task 2 清账后应恒为空）
      - name: Go format gate (gofmt)
        shell: bash
        run: |
          cd agent
          echo "gofmt -l 输出（空即通过）："
          gofmt -l .
          test -z "$(gofmt -l .)"

      # 静态检查门禁
      - name: Go vet gate
        shell: bash
        run: cd agent && go vet ./...

      # 测试门禁（含竞态检测）
      - name: Go test gate (race detector)
        shell: bash
        run: cd agent && go test -race ./...

  # ── Windows 产物冒烟（仅"打包面"变更时触发）────────────────────────────────────
  # 为什么要有这个 job：build-release.yml 只在**发版 tag** 时跑，故打包面（打包脚本 / 桌面入口 /
  # 依赖清单 / 验包脚本本身）若在合并进 master 之前就是坏的，要等到发版日才炸 —— 反馈太晚。
  # 本 job 把「构建 + 真启验包」提前到 PR/merge 上，且只在打包面变更时点亮，避免每次 PR 都烧
  # 一台 windows runner 跑十几分钟 PyInstaller。
  #
  # 为什么用 dorny/paths-filter 而非把 `paths:` 写进 workflow 的 `on:`：GitHub 的 `paths` 只作用于
  # **整个 workflow**，挂在顶层会让不碰打包面的 PR 连 `ci` 质量闸都不跑（严重回归）。故用一个
  # 便宜的 ubuntu job 先探路径，再让 windows 冒烟 job 用 `if` 与之联动。
  windows-smoke-changes:
    name: Detect packaging-surface changes
    runs-on: ubuntu-latest
    outputs:
      # fail-open：过滤步「没拿到干净的 success 结果」（失败 / 被跳过）时，packaging 缺省为 'true'
      # ⇒ 下面的 Windows 冒烟 job 照跑。一个「只用来决定要不要跑」的过滤步，绝不该有能力把
      # master push 弄红 —— 宁可多烧一台 windows runner 跑一次闸。
      # 判据用 steps.filter.outcome（continue-on-error 改写前的**真实**结果），而非 conclusion：
      # 过滤步失败时 outcome='failure'，但 conclusion 会被 continue-on-error 改写成 'success'。
      packaging: ${{ steps.filter.outcome == 'success' && steps.filter.outputs.packaging || 'true' }}
    steps:
      # MUST 先检出**全历史**（fetch-depth: 0）：dorny/paths-filter 在 push 事件下要以
      # github.event.before 为基线做 git diff；checkout 默认浅克隆（fetch-depth: 1）时基线提交
      # 不在本地对象库 ⇒ git exit 128（这正是 master push 红、PR 绿的原因——PR 走另一套基线机制）。
      # 全历史检出是 dorny/paths-filter 文档对 push 事件的硬性要求；位置与写法对齐 ci.yml 其它 job。
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect packaging-surface changes
        id: filter
        uses: dorny/paths-filter@v4
        # fail-open 接线：本步失败（例如基线缺失致 git exit 128）时 MUST NOT 让 job 红 —— 上面的
        # outputs 表达式会把 packaging 缺省为 'true'（按「发生变更」处理，照跑闸）。
        continue-on-error: true
        with:
          # 「打包面」路径清单：命中任一 ⇒ 点亮下面的 Windows 冒烟 job。这份清单即「闸的触发面」，
          # MUST 与 build-release.yml 的 Windows 构建面保持同源（tests/test_ci_hardening.py 逐项
          # 钉死，防清单漂移导致"闸永不触发"——本仓有过"正则永不命中"的教训）。
          filters: |
            packaging:
              - 'package_windows.py'
              - 'desktop.py'
              - 'start.py'
              - 'requirements.txt'
              - 'requirements-desktop.txt'
              - 'tools/verify_windows_portable.py'
              - '.github/workflows/build-release.yml'
              # 改闸自己的定义也要重跑闸 —— 否则「接线被改坏」这件事只能等下次真正的打包面变更才暴露
              - '.github/workflows/ci.yml'

  windows-portable-smoke:
    name: Windows Portable Smoke (build + 真启闸)
    needs: windows-smoke-changes
    # 手动触发（workflow_dispatch）时 paths-filter 无 base 可比 ⇒ 无条件跑，方便按需验证。
    if: needs.windows-smoke-changes.outputs.packaging == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    # 与 ci job 同款护栏：PyInstaller 构建 + spaCy 收集较慢，但绝不放任卡死烧满默认 6 小时。
    timeout-minutes: 30
    env:
      PYTHONIOENCODING: "utf-8"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      # 与 build-release.yml 的 Windows 装法**逐项同源**（含 requirements-desktop.txt 与 spaCy
      # 模型）：冒烟环境若与发布环境不同，闸过了也证明不了发布产物能起。
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pytest
          pip install -r requirements-desktop.txt
          python -m spacy download de_core_news_sm

      - name: Run pytest suite
        # 测试先于构建：本闸此前只验「打包 + 真启」、不跑测试 ⇒ 平台专属的测试失败只能等
        # 打 tag 后才暴露（v5.17.0 首次 tag 的 macOS 红卡正是此形态）。红就别再构建。
        run: pytest -q

      - name: Build Windows Portable
        run: python package_windows.py

      - name: Verify Windows Portable (真启闸)
        # --expect-commit 传完整 GITHUB_SHA；脚本按前缀比对产物里的短 sha（详见
        # tools/verify_windows_portable.py::commit_mismatch）。
        run: python tools/verify_windows_portable.py --expect-commit ${{ github.sha }}

  # ── Go↔Python 真链路集成门禁（Task 2「CI 半」）────────────────────────────────────
  #
  # 判据：本 job 验的是**真链路** —— Go 侧 app.Run / pythonsvc.Supervisor 真起一个
  # uvicorn 子进程（delector.server:app），经真实 HTTP 打到 /api/tools/* 并断言
  # writing_check 的契约键；绝不接受 stub / mock 顶替。build tag `integration`
  # 就是把这套重用例隔离在常规 `go test ./...` 之外的带子。
  #
  # 为何单开 job 而非并入 `ci`：它要的东西与 `ci` 不同（Python 侧依赖齐全 + 真起服务
  # 的耗时与失败模式），分开后「集成红」与「单测红」在 UI 上可分辨、可单独重跑。
  #
  # 零 SKIP 判据（2026-10-15 回炉轮：取代上一版「跳过语义」口径）：
  #   Go 的 t.Skipf 是**成功退出**（go test 返回 0），而 agent/integration_test.go
  #   的三处 skip 里「起服失败」「analyze 出错」都可能是**产品问题** ⇒ 放任 skip 等于
  #   「门禁绿着丢信号」（比红更坏）。故本 job 绿 = **零 skip**：集成用例只要跳过一个，
  #   门禁即红，并打出该用例名与 Go 的 skip 原因行（见最后一步的 -json 判据）。
  #   MUST NOT 为了让日志好看而放宽断言，也不得改回「skip 当绿」。
  #
  # 判据作用域（MUST 收窄到集成用例）：跳过判据只作用于「加了 integration tag 才存在
  #   的包」（go list 两级差集算出）。常规包里有合法的平台分支 skip ——
  #   internal/pythonsvc 的 unix SIGTERM 单测在 ubuntu runner 上必然 skip ——
  #   若把它的 skip 也计入，本 job 会在 Linux 上恒红。
  #
  # -count=1（2026-10-15 回炉轮）：Go 的测试缓存键只依赖 Go 侧输入（含
  #   agent/go.mod），只改 delector/（Python 侧）时缓存键不变 ⇒ 命中 `ok (cached)`，
  #   Python 服务根本不起，门禁变摆设。`-count=1` 强制每次真跑。
  agent-integration:
    name: Go↔Python Integration Gate (真链路, ubuntu)
    runs-on: ubuntu-latest
    # 卡死护栏（同 ci / windows-portable-smoke：不设时 GitHub 默认上限 360 分钟）。
    # 算术：本机实测全量 `go test -tags integration ./...` 暖缓存 14.0s、空 GOCACHE
    # 冷编译 25.8s（依赖仅 go-openai + cobra）；CI 冷跑再叠 checkout/setup 约 30s +
    # pip 装 requirements.txt（含 spaCy，约 1–1.5min）+ spaCy de_core_news_sm 模型
    # 约 30s ⇒ 标称冷启动 ≈ 3.5min；runner 拥塞按 2x ⇒ ≈ 7min。
    # 取 20 ≈ 标称 5.7x / 拥塞情形 2.9x：宽到不会被慢 runner 误杀，又远低于 360min
    # 默认（真挂死时 20min 即红，不会烧满六小时）。
    timeout-minutes: 20
    env:
      PYTHONIOENCODING: "utf-8"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      # 只装 requirements.txt：uvicorn / fastapi / spacy 都在里面，正是真链路所需。
      # **不装** requirements-desktop.txt —— 那是 Windows 桌面壳专属（pywebview /
      # pythonnet / pystray / pillow），其文件头明令「绝不并入公共依赖面」；在 Linux
      # 上装它既无意义，还会引入缺 GTK/WebKit 的导入异常。
      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # spaCy 德语模型：delector 侧模型加载是**惰性**的（ADR-0018 §7.6，import 期
      # 不得 spacy.load），缺模型不会让服务起不来 —— 但会让 TestGoPythonPipelineAnalyze
      # 走 skip，或在请求内触发 spacy 自动下载而拖慢、乃至撞上 60s 超时转成 skip。
      # 显式预下载使三条集成用例都拿到真信号，避免「日志全绿但用例根本没跑」。
      - name: Download spaCy German model
        run: python -m spacy download de_core_news_sm

      - name: Set up Go (version from agent/go.mod)
        uses: actions/setup-go@v7
        with:
          # MUST 用 go-version-file 而非硬编码：agent/go.mod 的 `go 1.26` 是唯一真相
          # 源，硬编码版本号会在升级 Go 时与 go.mod 漂移成两个真相源。
          go-version-file: agent/go.mod
          # cache 是 boolean（setup-python 的才是字符串 "pip"），勿写成字符串。
          cache: true
          cache-dependency-path: agent/go.mod

      # 显式钉住解释器并透传：DELECTOR_PYTHON 是 mustNotSkipEnv 的最高优先候选。不设
      # 也能跑（候选链退到 python3 → python），但 CI 上显式写死可消除「PATH 上恰好有
      # 个缺依赖的 python3」这类隐式耦合；选定结果由测试的 t.Logf 打进日志便于回溯。
      - name: Resolve Python interpreter for the gate
        run: echo "DELECTOR_PYTHON=$(command -v python3)" >> "$GITHUB_ENV"

      # 真链路门禁本体（Go 起真实 Python 托管进程 + 真实 HTTP 契约，不做 stub）。
      # 注：`-tags integration` 是**叠加**而非替换，常规单测照跑（本 job 是 ci job 的
      # 超集口径），故本 job 红 ⇒ 真链路或单测二者之一断裂。
      #
      # ── 零 SKIP 判据（2026-10-15 回炉轮）────────────────────────────────────────────
      #   Go 的 t.Skipf 是**成功退出**（go test 返回 0），而 integration_test.go 的三处
      #   skip 里「起服失败」「analyze 出错」都可能是**产品问题** ⇒ 放任 skip
      #   等于「门禁绿着丢信号」。故本步用 -json 抓事件流：集成用例出现任一
      #   skip ⇒ 非零退出，并把该用例的 Go 原始跳过原因行（文件:行 + 理由）打出来。
      #   判据作用域 MUST 收窄到「加了 integration tag 才存在的包」（下方 ① 用 go list
      #   两级差集算出）：常规包里有合法的平台分支 skip —— internal/pythonsvc
      #   的 unix SIGTERM 单测在 ubuntu runner 上必然 skip —— 若一并计入，本 job 会在 Linux 上恒红。
      #
      # ── -count=1（2026-10-15 回炉轮）─────────────────────────────────────────────────────
      #   Go 测试缓存键只依赖 Go 侧输入（含 agent/go.mod），只改 delector/
      #   （Python 侧）时缓存键不变 ⇒ 命中 `ok (cached)`：Python 服务根本不起，门禁变摆设。
      #   `-count=1` 强制每次真跑（不得为了让日志好看而删掉）。
      - name: Go↔Python integration gate (real service, no stub, zero skip)
        shell: bash
        run: |
          cd agent

          # ① 圈定零 SKIP 判据的作用域：仅「加了 integration tag 才存在的包」。
          go list -tags integration ./... | sort > "${RUNNER_TEMP}/integ-pkgs-with-tag.txt"
          go list ./... | sort > "${RUNNER_TEMP}/integ-pkgs-without-tag.txt"
          comm -23 "${RUNNER_TEMP}/integ-pkgs-with-tag.txt" "${RUNNER_TEMP}/integ-pkgs-without-tag.txt" > "${RUNNER_TEMP}/integ-pkgs-only.txt"
          echo "集成用例专属包（零 SKIP 判据作用域）："
          cat "${RUNNER_TEMP}/integ-pkgs-only.txt"
          if [ ! -s "${RUNNER_TEMP}/integ-pkgs-only.txt" ]; then
            echo "::error::集成用例专属包清单为空：没有任何包只在 integration tag 下存在（tag 漂移 / 集成测试文件被删）⇒ 门禁空转"
            exit 2
          fi

          # ② 真跑：-count=1 禁测试缓存；-json 供 ③ 判 skip —— 且其 output 事件
          #   就是 -v 原文（`=== RUN` / `--- PASS: TestX (0.00s)`），日志即逐用例可读结果。
          LOG="${RUNNER_TEMP}/go-integration.jsonl"
          ERRLOG="${RUNNER_TEMP}/go-integration.stderr.log"
          rc=0
          go test -count=1 -json -tags integration ./... >"${LOG}" 2>"${ERRLOG}" || rc=$?
          if [ -s "${ERRLOG}" ]; then
            echo "----- go test stderr -----"
            cat "${ERRLOG}"
            echo "--------------------------"
          fi
          if [ "${rc}" -ne 0 ]; then
            echo "::error::go test 退出码 ${rc}（编译失败或用例失败）⇒ 门禁红"
            exit "${rc}"
          fi

          # ③ 零 SKIP 判定 + 集成用例 PASS 计数（PASS=0 同样是门禁空转 ⇒ 红）
          python3 - "${LOG}" "${RUNNER_TEMP}/integ-pkgs-only.txt" <<'PY'
          import json
          import sys

          log_path, pkgs_path = sys.argv[1], sys.argv[2]
          with open(pkgs_path, encoding="utf-8") as fh:
              integ_pkgs = set(ln.strip() for ln in fh if ln.strip())
          if not integ_pkgs:
              sys.exit("::error::集成用例专属包清单为空，门禁无从判定（空转）")

          buf = {}   # (pkg, test) -> [Go 原始输出行]
          skips, passes, fails, garbage = [], [], [], []
          with open(log_path, encoding="utf-8") as fh:
              for lineno, line in enumerate(fh, 1):
                  line = line.strip()
                  if not line:
                      continue
                  try:
                      ev = json.loads(line)
                  except ValueError:
                      garbage.append((lineno, line[:200]))
                      continue
                  pkg, test, act = ev.get("Package", ""), ev.get("Test", ""), ev.get("Action")
                  if act == "output":
                      # -json 的 output 事件即 -v 原文（=== RUN / --- PASS: TestX (0.00s) /
                      # 文件:行: 日志），原样透传 ⇒ CI 日志就是逐用例的可读结果。
                      text = ev.get("Output", "")
                      sys.stdout.write(text)
                      buf.setdefault((pkg, test), []).extend(text.splitlines())
                  elif act == "skip" and test:
                      skips.append((pkg, test))
                  elif act == "pass" and test:
                      passes.append((pkg, test))
                  elif act == "fail" and test:
                      fails.append((pkg, test))
          sys.stdout.flush()

          if garbage:
              sys.exit("::error::%s 含无法解析的行，零 SKIP 判据失效（门禁拒绝放行）：%s" % (log_path, garbage[:3]))

          in_skips = [s for s in skips if s[0] in integ_pkgs]
          in_passes = [p for p in passes if p[0] in integ_pkgs]
          in_fails = [f for f in fails if f[0] in integ_pkgs]
          print("===== 零 SKIP 判据（作用域=%s）：集成用例 PASS=%d SKIP=%d FAIL=%d =====" % (sorted(integ_pkgs), len(in_passes), len(in_skips), len(in_fails)))
          for pkg, test in in_skips:
              print("::error::集成用例 %s（包=%s）被跳过 —— 跳过用例名与 Go 的 skip 原因行：" % (test, pkg))
              for ln in buf.get((pkg, test), []):
                  if ln.strip():
                      print("::error::    %s" % ln.strip())
          if in_skips:
              sys.exit(1)
          if not in_passes:
              sys.exit("::error::集成用例 PASS=0 ⇒ 门禁空转（集成用例一个都没真跑），拒绝放行")
          print("===== 零 SKIP 判据通过：集成用例全部真跑且无 skip =====")
          PY

  # ── master 直推范围机械闸（P1-1：分支纪律此前没有机械闸）────────────────────────
  # 为什么：docs/agents/ops.md:202-216 自述「分支纪律没有机械闸」；2026-10-09~14 有 25 个
  # feat/fix/ci/test/perf 提交直推 master（含生产代码与 CI 定义），且已实发 f49d359 推红
  # 事故。规则 2026-10-14 才写进可见文档。本 job 把「master 上非 merge 提交的改动面 MUST ⊆
  # 白名单」变成 CI 硬闸（与 .githooks/pre-push 共用同一判定器 tools/check_master_commit_scope.py）。
  #
  # 为什么仅 push 事件：范围 before..sha 只在 push 上有意义（PR 走 merge-base，无 before）。
  # 为什么 fetch-depth: 0：baseline(github.event.before) 必须在本地对象库，否则 git 取不到
  #   范围基线 —— 与 windows-smoke-changes 同一课（浅克隆下 git exit 128 把 master 推红）。
  master-direct-push-scope:
    name: Master Direct-Push Scope Gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    # 卡死护栏（同 ci job：一条卡死判定会给 runner 烧满默认 360 分钟）。
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # 需要 before 基线在本地对象库（浅克隆下取不到范围 ⇒ git exit 128）。
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # 纯 stdlib：无需 pip install。退出码 0=通过、1=有违规（job 红）、2=环境不可用（job 红）。
      - name: Enforce master direct-push scope
        run: python tools/check_master_commit_scope.py --range "${{ github.event.before }}..${{ github.sha }}"

  # ── 密钥扫描闸（pre-commit 可被 --no-verify 绕过 ⇒ CI 侧必须有牢靠兜底）──────────────
  # 为什么要有这个 job：`.githooks/pre-commit` 已有暂存区密钥扫描，但 hook 是**本地**闸 ——
  # `git commit --no-verify`（或未装 hook 的 clone）能整个绕过，密钥会静默入库。CI 侧此前
  # 0 命中 `gitleaks|trufflehog|detect-secrets|GitGuardian` ⇒ 入库后没有任何兜底。本 job 补上。
  #
  # 扫描范围：只扫「**本次改动的提交范围**」，**不**扫全历史。gitleaks-action 在
  #   - pull_request：按 PR 的 base^..head 扫（即 PR diff）；
  #   - push        ：按本次推上来的提交范围扫。
  # 【为什么必须加 if 闸】不加时 `workflow_dispatch`（本 workflow 有）会退化成不带
  # `--log-opts` 的 `gitleaks detect` ⇒ **全历史扫描** ⇒ 历史误报会在启用当日就把 CI 弄红
  # （一开就红的闸等于没有闸）。故用 if 把本 job 限定在 pull_request / push 两类事件。
  # `fetch-depth: 0` 只是让范围提交在本地对象库可解析（浅克隆下 base^ 取不到 ⇒ git exit 128，
  # 与 windows-smoke-changes 同一课），**不等于**扫全历史 —— 扫描范围由 action 的 --log-opts 决定。
  #
  # fail-loud：gitleaks-action 命中时 `process.exit(1)`（gitleaks 退出码 2 = 检出泄漏），
  # 无法用「容错开关」（@actions 的 continueOnError 机制）关掉；本 job MUST NOT 声明容错键
  # （一加就成摆设：命中也不红）。
  # 本仓为 PUBLIC 个人账号：action 侧按 owner type=User 判定 ⇒ 无需 GITLEAKS_LICENSE。
  #
  # 【与任务书的一处偏离，有据可查】任务书写 `gitleaks/gitleaks-action@v2`；改用 @v3 是因为
  # v2 跑 Node 20 运行时，而 GitHub 已于 2026-09-16 从托管 runner 移除 Node 20 ⇒ v2 当天起
  # **无法运行**（gitleaks-action v3.0.0 release note 明载）；v3 仅把运行时升到 Node 24，
  # inputs / outputs / behavior 完全不变（同上 release note），与本仓既有 Node 24 系 action
  # （checkout@v7 / setup-python@v7）一致。gitleaks 二进制版本由 action 自带硬编码常量固定。
  secret-scan:
    name: Secret Scan (gitleaks)
    # 只在「改动面」事件跑：workflow_dispatch 会退化成无 --log-opts 的全历史扫描（见上），故排除。
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    # 卡死护栏（同 ci job：GitHub 默认单 job 上限 360 分钟，一条卡死会烧满配额）。
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # 范围扫描（base^..head）要求这些提交在本地对象库；浅克隆下 git 取不到范围。
          fetch-depth: 0

      - name: Run gitleaks on the change range
        uses: gitleaks/gitleaks-action@v3
        env:
          # PR 评论与 owner-type 判定需要 token（action 内置需要）。
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 显式指向本仓允许清单（不设时 gitleaks 也会自动读仓库根的 .gitleaks.toml）。
          GITLEAKS_CONFIG: .gitleaks.toml

  # ── 无静默降级机械闸（C2/C8 缺陷族的类级固化）─────────────────────────────
  # 为什么：C2/C8 缺陷族同形态 —— 错误 / 降级路径不可见（except: pass 吞错、裸 except
  #   抹平异常类型、证书校验静默关闭）。站点被逐个修完后，**类**此前无机械闸 ⇒ 可无声回长。
  #   判定器 tools/check_silent_degradation.py（纯 stdlib，零 pip install）扫描
  #   delector/**/*.py 与 tools/**/*.py，三条窄判据 + `silent-ok: REASON` 注释豁免约定。
  # 为什么是 CI 而非只靠本地 hook：.githooks/pre-commit 只扫暂存区密钥，对该形态零覆盖；
  #   且本地 hook 可被 --no-verify 绕过、fresh clone 上不存在 —— CI 才是不可绕过的权威层。
  # fail-loud：有未豁免站点退出码 1（job 红）；环境不可用退出码 2（同样红）。
  #   本 job 及其每一步 MUST NOT 声明 continue-on-error（一加就成摆设）。
  silent-degradation:
    name: No Silent Degradation Gate
    runs-on: ubuntu-latest
    # 卡死护栏（同 ci job：GitHub 默认单 job 上限 360 分钟；本闸为秒级静态扫描，10 富余）。
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # 纯 stdlib：无需 pip install。退出码 0=通过、1=有未豁免站点（job 红）、2=环境不可用（job 红）。
      - name: Enforce no-silent-degradation criteria
        run: python3 tools/check_silent_degradation.py

  # ── mock 漂移机械闸（C8 事故族的类级固化；C9 Task 3）─────────────────────────
  # 为什么：C8 批次生产代码把 `_shelf_get` 的 `httpx.get` 改为 `httpx.stream`，而 4 个测试仍
  #   `monkeypatch.setattr(<encounter 模块>.httpx, "get", …)` —— 补丁钉在已无调用点的符号上：
  #   它照常执行、零报错，但测试验证的东西消失了（假绿），CI 直到真实出站才红。
  #   判定器 tools/check_mock_drift.py（纯 stdlib，零 pip install）扫描 tests/**/*.py，解析
  #   monkeypatch.setattr(<obj>, "<symbol>", …) 的目标模块（delector.* / tools.*），要求符号在
  #   该模块内仍有引用/调用点；`mock-drift-ok: REASON` 注释豁免（空理由无效）。
  # fail-loud：有未豁免站点退出码 1（job 红）；环境不可用退出码 2（同样红）。
  #   本 job 及其每一步 MUST NOT 声明 continue-on-error（一加就成摆设）。
  mock-drift:
    name: Mock Drift Gate
    runs-on: ubuntu-latest
    # 卡死护栏（同 ci job：GitHub 默认单 job 上限 360 分钟；本闸为秒级静态扫描，10 富余）。
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # 纯 stdlib：无需 pip install。退出码 0=通过、1=有未豁免站点（job 红）、2=环境不可用（job 红）。
      - name: Enforce mock-drift criterion
        run: python3 tools/check_mock_drift.py

  # ── 分层依赖与循环引用机械闸（C5 分层规范固化）──────────────────────────────
  # 判定器 tools/check_layer_invariants.py（纯 stdlib，零 pip install）扫描 delector/ 下全部
  # 模块，确保 0 顶层循环依赖且遵循 Layer 0~5 单向层序，`layer-ok: REASON` 注释豁免。
  layer-invariants:
    name: Layer Invariants Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Enforce layer-invariants criterion
        run: python3 tools/check_layer_invariants.py
