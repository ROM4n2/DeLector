# =============================================================================
# CI 门禁 workflow：PR / push(master) 即跑全量测试与 Go 三门禁
# =============================================================================
#
# 门禁范围（为何只 ubuntu 单平台）：
#   本 workflow 的职责是"改动是否可用"（质量闸），不是"产物能否打包"。
#   Windows/macOS 构建矩阵留给 tag 触发的 build-release.yml，PR 反馈时长
#   预期 < 8min（pytest ~3-6min + Go 门禁 ~1min）。
#
# 与既有 workflow 的分工：
#   - ci.yml（本文件）  ：pull_request / push(master) / 手动触发 → pytest 全量
#     + gofmt / vet / -race 三门禁（质量闸，改动合入 master 前必须绿）；
#   - build-release.yml：仅 tag v* 触发 → 三平台打包 + Android APK + 发布（打包面）；
#   - build-agent.yml  ：仅 tag v* 触发 → agent 三平台 artifact（分发面）。
#
# cache 写法教训（99-Inbox：GitHub Actions tag 发版三重陷阱）：
#   setup-go@v5 的 cache 参数是 boolean，MUST 写 `cache: true` 并配
#   cache-dependency-path: agent/go.mod；误写成字符串型 "go" 会被 runner
#   直接拒绝（Input does not meet YAML 1.2 "Core Schema" specification）。
#   setup-python 的 cache 才是字符串（"pip"），两者不要混淆。
# =============================================================================
name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

# 同分支新 push 取消仍在跑的旧 CI：省 runner 分钟数、反馈更快
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Tests & Go Gates (ubuntu)
    runs-on: ubuntu-latest
    # 卡死护栏：不设时 GitHub Actions 对单个 job 的默认上限是 360 分钟（6 小时），
    # 一条永不返回的测试会把 runner 烧满六小时才红——提交者早改去下一件事了。
    # 取 15：文件头自陈"PR 反馈预期 < 8min"，实测单次约 2.5–3.5min，留足余量。
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      # Node 门禁的显式安装（2026-10-05 清债轮 C 组）。
      # tests/ 下有一批 wrapper 会 `node tools/*.mjs` 真跑 .mjs 行为探针。此前 CI 从不
      # 安装 node，wrapper 之所以"恰好真跑"靠的是 ubuntu-latest 镜像**预装**的 Node 20.x
      # —— 属隐式依赖：镜像一旦换版本/摘掉预装，探针会走 `shutil.which("node")` 守卫
      # **静默 skip**，测试全绿而探针根本没跑（比红更坏：回归无声溜过）。
      # 固定 major '20'（对齐 runner 自带的 20.x），MUST NOT 用 latest（不可复现）。
      - name: Set up Node 20
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      # 不装 pyinstaller——那是打包面（build-release.yml 的职责）
      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      # Ruff 静态门禁（2026-09-13 ruff-cleanup）。
      # ruff 是开发期工具：CI 内单独安装，**不进 requirements.txt**（混入运行时依赖
      # 会增大 Android 打包面体积与漂移面）。放在 spaCy 模型下载与全量测试之前——
      # lint 是秒级检查，先失败先反馈，省下长测试的等待。
      - name: Install Ruff
        run: pip install ruff

      - name: Ruff lint gate
        run: ruff check .

      # Mypy 类型门禁（2026-09-13 mypy-cleanup 起步；2026-09-18 strict 清账升级）。
      # 开发期工具：CI 内单独安装，**不进 requirements.txt**（Android 运行时纯净）。
      # 档位：--strict 覆盖 delector + tools 零错误（delector 250→0、tools 108→0，
      # 见 docs/specs/2026-09-18-mypy-strict-annotation-sweep-design.md）；tests
      # 保持适度档（pytest 测试函数注解收益低，另立评估），--follow-imports=skip
      # 只查 tests 自身（避免 delector 的 strict ignore 在配置档下 unused 冲突）。
      - name: Install Mypy
        run: pip install mypy

      - name: Mypy type gate (strict)
        run: mypy --strict delector tools

      - name: Mypy type gate (tests, config baseline)
        run: mypy --follow-imports=skip tests

      # Mypy 类型门禁（新入口裸露面，2026-10-10 windows-desktop-shell 收口）。
      # 上面两条门禁都**显式传了目标**（`--strict delector tools` / `--follow-imports=skip tests`），
      # 故仓库根的 desktop.py / conftest.py / package_windows.py / start.py **从不被检查**；pyproject
      # 的 `files` 只影响"本地裸跑 python -m mypy"（且裸跑会因既有 17 条无关错误转红），CI 不裸跑。
      # 口径：`--follow-imports=skip` 只查目标文件自身（不把既有 delector 模块的 unused-ignore 卷进来，
      # 与 tests 门禁同款）+ `--strict`（对齐 headline 档）。start.py 此前因两处 `# type: ignore` 在 skip
      # 下变 unused-ignore 而**卡住**（禁新增豁免）⇒ 一直未纳入；2026-10 用 setattr 按名赋值覆盖两代
      # uvicorn 信号 API、去掉那两处 ignore 后并入本条（ADR-0021 替代投资#2）。
      - name: Mypy type gate (desktop entry surface, strict)
        # MUST 带 `--platform win32`：desktop.py 是本项目 **Windows 专属**入口，源码用
        # `ctypes.windll` 与 `winreg.*`；mypy **默认按运行平台**（CI 是 ubuntu）挑 typeshed，
        # Linux 下这两个模块没有 windll / OpenKey / KEY_READ / QueryValueEx / CloseKey 等属性
        # ⇒ 报 5 处 attr-defined（本地 Windows 绿、CI 红 —— 门禁结果随平台漂移，是设计缺陷）。
        # 显式声明 `--platform win32` 使门禁与该文件真实目标平台一致：这正是它 2026-10-10
        # 第一次上线就在 CI 红掉的原因，别再顺手删掉。
        run: mypy --platform win32 --strict --follow-imports=skip desktop.py package_windows.py conftest.py start.py

      # 测试需要德语 spaCy 模型，与 build-release.yml 同源
      - name: Download spaCy German model
        run: python -m spacy download de_core_news_sm

      # 全量门禁：Python 测试套件一个不漏
      - name: Run full pytest suite
        run: pytest -q

      - name: Set up Go 1.26
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          # cache 是 boolean（区别于 setup-python 的字符串 "pip"）；
          # 误写成字符串 "go" 会被 runner 直接拒绝——99-Inbox 真实事故，勿改。
          cache: true
          cache-dependency-path: agent/go.mod

      # 格式门禁：gofmt -l 有输出即失败（Task 2 清账后应恒为空）
      - name: Go format gate (gofmt)
        shell: bash
        run: |
          cd agent
          echo "gofmt -l 输出（空即通过）："
          gofmt -l .
          test -z "$(gofmt -l .)"

      # 静态检查门禁
      - name: Go vet gate
        shell: bash
        run: cd agent && go vet ./...

      # 测试门禁（含竞态检测）
      - name: Go test gate (race detector)
        shell: bash
        run: cd agent && go test -race ./...

  # ── Windows 产物冒烟（仅"打包面"变更时触发）────────────────────────────────────
  # 为什么要有这个 job：build-release.yml 只在**发版 tag** 时跑，故打包面（打包脚本 / 桌面入口 /
  # 依赖清单 / 验包脚本本身）若在合并进 master 之前就是坏的，要等到发版日才炸 —— 反馈太晚。
  # 本 job 把「构建 + 真启验包」提前到 PR/merge 上，且只在打包面变更时点亮，避免每次 PR 都烧
  # 一台 windows runner 跑十几分钟 PyInstaller。
  #
  # 为什么用 dorny/paths-filter 而非把 `paths:` 写进 workflow 的 `on:`：GitHub 的 `paths` 只作用于
  # **整个 workflow**，挂在顶层会让不碰打包面的 PR 连 `ci` 质量闸都不跑（严重回归）。故用一个
  # 便宜的 ubuntu job 先探路径，再让 windows 冒烟 job 用 `if` 与之联动。
  windows-smoke-changes:
    name: Detect packaging-surface changes
    runs-on: ubuntu-latest
    outputs:
      packaging: ${{ steps.filter.outputs.packaging }}
    steps:
      - name: Detect packaging-surface changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          # 「打包面」路径清单：命中任一 ⇒ 点亮下面的 Windows 冒烟 job。这份清单即「闸的触发面」，
          # MUST 与 build-release.yml 的 Windows 构建面保持同源（tests/test_ci_hardening.py 逐项
          # 钉死，防清单漂移导致"闸永不触发"——本仓有过"正则永不命中"的教训）。
          filters: |
            packaging:
              - 'package_windows.py'
              - 'desktop.py'
              - 'start.py'
              - 'requirements.txt'
              - 'requirements-desktop.txt'
              - 'tools/verify_windows_portable.py'
              - '.github/workflows/build-release.yml'

  windows-portable-smoke:
    name: Windows Portable Smoke (build + 真启闸)
    needs: windows-smoke-changes
    # 手动触发（workflow_dispatch）时 paths-filter 无 base 可比 ⇒ 无条件跑，方便按需验证。
    if: needs.windows-smoke-changes.outputs.packaging == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    # 与 ci job 同款护栏：PyInstaller 构建 + spaCy 收集较慢，但绝不放任卡死烧满默认 6 小时。
    timeout-minutes: 30
    env:
      PYTHONIOENCODING: "utf-8"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      # 与 build-release.yml 的 Windows 装法**逐项同源**（含 requirements-desktop.txt 与 spaCy
      # 模型）：冒烟环境若与发布环境不同，闸过了也证明不了发布产物能起。
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pytest
          pip install -r requirements-desktop.txt
          python -m spacy download de_core_news_sm

      - name: Build Windows Portable
        run: python package_windows.py

      - name: Verify Windows Portable (真启闸)
        # --expect-commit 传完整 GITHUB_SHA；脚本按前缀比对产物里的短 sha（详见
        # tools/verify_windows_portable.py::commit_mismatch）。
        run: python tools/verify_windows_portable.py --expect-commit ${{ github.sha }}
