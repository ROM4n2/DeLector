<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DeLector</title>
<style>
  :root { color-scheme: light; }
  html, body { margin: 0; padding: 0; height: 100%; background: #FAF8F5; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans SC", sans-serif;
    color: #1B1E28;
    -webkit-user-select: none; user-select: none;
  }
  #stage {
    position: absolute; inset: 0; box-sizing: border-box;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 0 24px;
  }
  #title { font-size: 36px; font-weight: 700; line-height: 1.2; text-align: center; }
  #subtitle { margin-top: 12px; font-size: 14px; color: #7A6854; text-align: center; }
  /*
   * 状态三层（I1：任何字形都不得是意义的唯一载体）：
   *   图标 = inline SVG（aria-hidden，仅冗余通道）
   *   文案 = 「正在启动本地服务…」
   *   形状 = 描边胶囊（边框 + 填充），与文字同时存在，删掉任一层仍有可读语义。
   * 全程静态、无 CSS 动画 —— 持续 60fps 重绘会与 Chaquopy/Python 抢 CPU（实测 +155ms TTFD）。
   */
  #state {
    margin-top: 28px;
    display: inline-flex; align-items: center; gap: 8px;
    max-width: 100%;
    padding: 8px 14px;
    border: 1px solid #D9D1C4; border-radius: 999px;
    background: #F3EEE6;
    color: #6B5C46;
    font-size: 13px; line-height: 18px;
  }
  #state svg { width: 16px; height: 16px; flex: none; display: block; }
  #state-text { min-width: 0; }
  @media (max-width: 360px) {
    #stage { padding: 0 20px; }
    #title { font-size: 28px; }
    #subtitle { font-size: 13px; }
    #state { font-size: 12px; padding: 6px 12px; }
  }
  @media (max-height: 420px) {
    #state { margin-top: 18px; }
  }
</style>
</head>
<body>
<div id="stage">
  <div id="title">DeLector</div>
  <div id="subtitle">德语欧标精读与备考工作台</div>
  <div id="state">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
      <rect x="2" y="3" width="20" height="9" rx="2"></rect>
      <rect x="2" y="13" width="20" height="8" rx="2"></rect>
      <line x1="6" y1="7.5" x2="6.01" y2="7.5"></line>
      <line x1="6" y1="17" x2="6.01" y2="17"></line>
    </svg>
    <span id="state-text">正在启动本地服务…</span>
  </div>
</div>
<script>
(function () {
  'use strict';
  var reported = false;
  function report() {
    if (reported) return;
    reported = true;
    try {
      if (window.ShellHost && window.ShellHost.onFirstContentFrame) {
        window.ShellHost.onFirstContentFrame();
      }
    } catch (e) { /* 回报失败不影响壳页渲染 */ }
  }
  // 三帧 rAF：第 1 帧提交布局，第 2 帧产出完整内容帧，第 3 帧回调时
  // 第 2 帧已经上屏（实测双 rAF 时，撤场会抢在内容帧显示前，露 1 帧纯底色）。
  requestAnimationFrame(function () {
    requestAnimationFrame(function () {
      requestAnimationFrame(report);
    });
  });
})();
</script>
</body>
</html>
