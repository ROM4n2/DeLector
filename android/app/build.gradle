plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

// 版本号只维护一个源头：git tag。CI 从 tag 推导后通过环境变量注入，
// 本地构建无环境变量时用 fallback 默认值。
def releaseVersionName = System.getenv("DELECTOR_VERSION_NAME") ?: "4.8.0"
def releaseVersionCode = (System.getenv("DELECTOR_VERSION_CODE") ?: "40800").toInteger()

// 钉死的签名 keystore。CI 把它从 secret 解到 $RUNNER_TEMP（永不进工作树），
// 本地开发与 fork 没有这个环境变量，签名配置整段不生效、回落到 AGP 自动生成的
// debug keystore —— 构建照常能跑。
// 注意：只有「文件真的存在」才算生效，光有环境变量不算，否则 gradle 会在
// 签名阶段才炸，错误信息离根因很远。
def pinnedKeystore = System.getenv("DELECTOR_KEYSTORE_PATH")
def hasPinnedKeystore = pinnedKeystore != null && !pinnedKeystore.isEmpty() && file(pinnedKeystore).exists()

android {
    namespace 'org.delector.app'
    compileSdk 34

    // MainActivity.syncStaticAssets() 靠 BuildConfig.VERSION_CODE 判断要不要重解包
    // 前端资产。AGP 8 起 buildConfig 的默认值随模块类型和版本变过，别赌默认值：
    // 关掉的话报的是 "cannot find symbol BuildConfig"，而且只在 CI 构建时才炸。
    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        debug {
            // 为什么钉 debug 而不是新开 release 变体：Android 只比较证书是否一致、
            // 不看构建变体，签名稳定性收益完全等同；而 release 变体会是本项目第一次
            // 走 R8/proguard，Chaquopy + spaCy 的资源解包从未在该路径验证过，
            // 失效方式是静默的（App 照常启动，只是语法标注悄悄退化）。
            if (hasPinnedKeystore) {
                storeFile file(pinnedKeystore)
                storePassword System.getenv("DELECTOR_KEYSTORE_PASSWORD")
                keyAlias System.getenv("DELECTOR_KEY_ALIAS")
                keyPassword System.getenv("DELECTOR_KEY_PASSWORD")
                // AGP 在 minSdk>=24 时默认只出 v2/v3 签名（藏在 APK Signing Block 里），
                // 而 CI 验签闸用 keytool -printcert -jarfile 只认 v1（META-INF 的 .RSA）。
                // 不显式开 v1，闸读出的指纹是空的 —— v3.10.0 首跑实测死在这：
                // keystore 指纹对得上、APK 指纹却是空，闸分不清「真没签名」和
                // 「只是读不到」，等于闸失效了一半。
                v1SigningEnabled true
            }
        }
    }

    defaultConfig {
        applicationId "org.delector.app"
        minSdk 24
        targetSdk 34
        // versionCode 编码规则：major*10000 + minor*100 + patch。
        // 旧规则 major*100 + minor*10 + patch 在 minor 到 10 时溢出撞车
        // （3.10.0 与 4.0.0 都是 400），而 versionCode 必须严格单调递增，
        // 撞车意味着 4.0.0 无法覆盖安装 3.10.0。
        versionCode releaseVersionCode
        versionName releaseVersionName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk {
            // 只出 arm64-v8a：spaCy 的原生栈按 ABI 各占 ~21-29MB，三个全打是 106MB。
            // armeabi-v7a（32 位老机型）与 x86_64（模拟器）为控制体积放弃。
            abiFilters "arm64-v8a"
        }

        python {
            version "3.10"

            // Chaquopy 默认不把任何包的数据文件解到文件系统（构建产物里
            // build.json 的 extract_packages 为空），Python 代码从 .imy 压缩包里
            // 直接执行。但这三个包会用 Path(__file__).parent / "xxx" 去 open()
            // 真实文件，不解包就必然 FileNotFoundError：
            //   de_core_news_sm  模型 config.cfg / 权重 / attribute_ruler patterns（29 个文件）
            //   spacy            default_config.cfg、cli/templates/*.yml
            //   thinc            backends/_custom_kernels.cu（模块顶层 read_text，无保护）
            // 各包 *.dist-info/entry_points.txt 不用列——catalogue 走
            // importlib.metadata，Chaquopy 的 ChaquopyPathFinder 能直接从 zip 读。
            extractPackages "spacy", "thinc", "de_core_news_sm"

            pip {
                install "pydantic<2.0.0"
                install "fastapi<0.100.0"
                install "uvicorn"
                install "httpx"
                install "genanki"
                // Chaquopy 自己的 native 仓库提供 cp310/android_24 的预编译 wheel，
                // 会连带拉入 thinc/blis/numpy/cymem/preshed/murmurhash/srsly。
                // 不额外 pin numpy，让 Chaquopy 的解析器用它仓库里那份（cp310 只有 1.26.2）。
                install "spacy==3.8.7"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.webkit:webkit:1.10.0'
}
