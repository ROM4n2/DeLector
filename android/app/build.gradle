plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'org.delector.app'
    compileSdk 34

    defaultConfig {
        applicationId "org.delector.app"
        minSdk 24
        targetSdk 34
        versionCode 350
        versionName "3.5.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk {
            // 只出 arm64-v8a：spaCy 的原生栈按 ABI 各占 ~21-29MB，三个全打是 106MB。
            // armeabi-v7a（32 位老机型）与 x86_64（模拟器）为控制体积放弃。
            abiFilters "arm64-v8a"
        }

        python {
            version "3.10"
            pip {
                install "pydantic<2.0.0"
                install "fastapi<0.100.0"
                install "uvicorn"
                install "httpx"
                install "genanki"
                // Chaquopy 自己的 native 仓库提供 cp310/android_24 的预编译 wheel，
                // 会连带拉入 thinc/blis/numpy/cymem/preshed/murmurhash/srsly。
                // 不额外 pin numpy，让 Chaquopy 的解析器用它仓库里那份（cp310 只有 1.26.2）。
                install "spacy==3.8.7"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.webkit:webkit:1.10.0'
}
