buildscript {
    repositories {
        google()
        mavenCentral()
        maven { url "https://chaquo.com/maven" }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.4.2'
        classpath 'com.chaquo.python:gradle:15.0.1'
    }
}

tasks.register('clean', Delete) {
    delete rootProject.buildDir
}
